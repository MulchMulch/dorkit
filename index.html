  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    height: 100dvh;
    width: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    background: #8FD3F4;
    font-family: 'Baloo 2', sans-serif;
    color: #3B230F;
    /* Matches the thickness of the black outline drawn around the
       "DORK IT" title (that outline is built from text-shadow rings out
       to 0.065em of the title's clamp(44px, 15vw, 92px) font-size —
       i.e. 0.065 * 44px to 0.065 * 92px, scaling with 0.065 * 15vw in
       between). Used as the border-width for every black-bordered box
       and button so they all read as the same stroke weight. */
    --dork-border-w: clamp(3px, 1vw, 6px);
  }
  /* Oversized fixed background element — deliberately bigger than the
     viewport in every direction and pinned with position:fixed so that
     iOS Safari's address bar/toolbar collapsing or expanding during a
     swipe attempt can never reveal white space behind the page. This is
     a real DOM element (not a pseudo-element) placed first in <body>
     so it can't be affected by any ancestor positioning quirks. */
  #bgFill {
    position: fixed;
    top: -25vh; left: -25vw;
    width: 150vw; height: 150vh;
    background: #8FD3F4;
    pointer-events: none;
  }
  /* Same oversized/fixed trick as #bgFill, painted on top of it (later in
     DOM order, same default stacking level) so the tiled icon pattern
     sits above the gradient but still stays fully behind the app
     content. IMPORTANT: no negative z-index here — a position:fixed
     element with z-index < 0 renders BEHIND the root canvas background
     painted by html/body's own "background", making it invisible no
     matter what it contains. Leaving z-index at its default (auto) and
     relying on DOM order keeps these layers correctly stacked: behind
     .dork-app, but on top of the page's canvas background. */
  #logoTile {
    position: fixed;
    top: -25vh; left: -25vw;
    width: 150vw; height: 150vh;
    pointer-events: none;
  }
  #logoTile svg { display: block; width: 100%; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  /* position:relative (no offset, so no layout change) is required here:
     #bgFill/#logoTile are position:fixed. Per CSS stacking rules, ANY
     positioned element (even with z-index:auto) paints above static
     in-flow content in the same stacking context, regardless of DOM
     order. Without this, .dork-app (static) would render BEHIND the
     fixed background layers no matter what order they're written in,
     hiding the whole app. Making .dork-app positioned too puts it in
     the same z-index:auto stacking bucket as the background layers,
     where DOM order (declared after them) correctly wins. */
  .dork-app { position: relative; width: 100%; max-width: 640px; min-width: 0; user-select: none; -webkit-user-select: none; }

  .dork-header { display: flex; align-items: center; justify-content: center; margin-bottom: 18px; width: 100%; min-width: 0; overflow: hidden; }
  .dork-title {
    font-family: 'Fredoka One', 'Baloo 2', sans-serif; font-weight: 400; font-size: clamp(44px, 15vw, 92px);
    color: #FFF8ED;
    /* Thick outline built from two concentric rings of small text-shadow
       offsets (in em, so it scales with font-size) rather than
       -webkit-text-stroke — a real stroke self-intersects and breaks on
       glyphs like "R" in this font. The 8-point version left a visibly
       faceted/jagged ring around curves (O, D); using many more points
       per ring (16 inner, 28 outer) makes each ring dense enough to
       read as a smooth curve instead of a polygon. The drop shadow
       repeats that entire ring set again, shifted straight down, so the
       shadow has the stroke's outline baked into its silhouette instead
       of just being a plain copy of the thinner fill glyph underneath. */

      0.0282em 0.0586em 0 #000,

      0.0145em -0.0634em 0 #000,

    display: flex; align-items: center; gap: 10px;
    white-space: nowrap; max-width: 100%;
    transition: font-size 380ms cubic-bezier(.4,0,.2,1);
  }
  .dork-wiggle {
    display: inline-block;
    position: relative;
    top: 0.07em;
    text-shadow: none;
    animation: wiggle 1.6s ease-in-out infinite;
  }
  .dork-subbar { display: flex; align-items: center; justify-content: center; gap: 28px; margin-top: 18px; }
  .dork-readout {
    font-family: 'Fredoka', sans-serif; font-weight: 700;
    background: #FFF8ED; border: var(--dork-border-w) solid #3B230F; box-shadow: 3px 3px 0 rgba(59,35,15,0.3);
    padding: 6px 12px; border-radius: 16px; font-size: clamp(14px, 3.2vw, 18px);
    transition: padding 380ms cubic-bezier(.4,0,.2,1), font-size 380ms cubic-bezier(.4,0,.2,1), box-shadow 380ms cubic-bezier(.4,0,.2,1);
  }
  .dork-readout b { color: #FF5FA2; }
  .dork-readout.big {
    /* Keep the boxes at the same visual size as before, but grow them
       through their actual dimensions instead of transform scaling. This
       keeps the flex gap visually identical in idle and playing states. */
    padding: 13px 24px; border-radius: 22px; font-size: clamp(22px, 5.4vw, 32px);
    transform: none; box-shadow: 5px 5px 0 rgba(59,35,15,0.3);
  }
  .dork-readout.pulse-score {
    animation: scorePulse 0.32s ease-in-out;
    transform-origin: center center;
    will-change: transform;
  }

  .dork-relative {
    position: relative;
    min-height: clamp(308px, 94.6vmin, 770px);
    display: flex; align-items: center; justify-content: center;
  }
  .dork-pod {
    position: relative;
    width: 100%;
    max-width: clamp(260px, 90vmin, 700px);
    display: flex; flex-direction: column; align-items: center;
  }
  .dork-pod.wobble { animation: wobbleFail 0.5s ease; }

  .dork-confirm-wrap {
    position: relative;
    width: clamp(240px, 82vmin, 640px);
    height: clamp(240px, 82vmin, 640px);
    display: flex; align-items: center; justify-content: center;
    transform-origin: center;
    transform: translateY(-8px);
  }
  .dork-confirm-wrap.pulsing { animation: none; }
  .dork-ring {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 1;
    transition: transform 90ms ease;
  }
  .dork-ring.pressed { transform: none; }
  .dork-ring-fg {
    fill: none; stroke: #4ADE9C; stroke-width: 6; stroke-linecap: round;
    transition: stroke-dashoffset 45ms linear, stroke 120ms ease;
  }

  .dork-confirm {
    position: relative;
    z-index: 2;
    width: 88%;
    height: 88%;
    border-radius: 9999px;
    background: #FFF8ED;
    border-style: solid;
    border-width: var(--dork-border-w);
    border-color: #3B230F;
    color: #3B230F;
    font-family: 'Fredoka', sans-serif; font-weight: 700;
    font-size: clamp(22px, 6vmin, 44px);
    letter-spacing: 0.5px;
    line-height: 1.25;
    padding: 0 6%;
    cursor: default;
    transition: transform 90ms ease, border-color 150ms ease, box-shadow 150ms ease;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  .dork-confirm.playing { cursor: pointer; }
  .dork-confirm.idle-bounce { animation: bounceIdle 1.8s ease-in-out infinite; }
  .dork-confirm.pressed { transform: none; }
  .dork-confirm.success { animation: popIn 0.3s ease; }
  .dork-confirm.long-label { font-size: clamp(20px, 5.4vmin, 40px); overflow-wrap: anywhere; word-break: normal; }
  .dork-confirm.combo {
    box-shadow: 0 0 14px 6px rgba(255,215,0,0.45);
    animation: comboGlow 1s ease-in-out infinite alternate;
  }

  .confetti-piece {
    position: absolute; left: 50%; top: 50%; z-index: 40;
    font-size: clamp(48px, 9vmin, 84px); pointer-events: none;
    will-change: transform, opacity;
  }

  .dork-overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 0 8%; border-radius: 24px; background: #FFF8ED;
    border-style: solid; border-width: var(--dork-border-w); border-color: #3B230F;
    z-index: 20;
  }
  .dork-overlay-title {
    font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: clamp(32px, 7vw, 44px); color: #FF5FA2;
    margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
  }
  .dork-overlay p {
    color: #7A5A38; font-family: 'Baloo 2', sans-serif; font-weight: 600;
    font-size: clamp(21.12px, 5.016vw, 27.72px); max-width: 420px; margin: 0 0 20px; line-height: 1.5;
  }
  .dork-btn {
    font-family: 'Fredoka', sans-serif; font-weight: 700; background: #4ADE9C; color: #1F3B2C;
    border: var(--dork-border-w) solid #3B230F; box-shadow: 5px 5px 0 rgba(59,35,15,0.35);
    padding: 14px 34px; border-radius: 999px; font-size: clamp(16px, 3.8vw, 21px); cursor: pointer; margin-bottom: 16px;
  }
  .dork-highscore { font-family: 'Fredoka', sans-serif; font-weight: 700; color: #7A5A38; font-size: clamp(14px, 3.2vw, 18px); margin-top: 8px; }

  .dork-gameover-title {
    font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: clamp(30px, 7vw, 42px); color: #FF5C5C; margin-bottom: 8px;
  }
  .dork-gameover-score { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: clamp(34px, 8vw, 48px); color: #3B230F; margin-bottom: 4px; }
  .dork-gameover-sub { font-family: 'Baloo 2', sans-serif; font-weight: 600; color: #7A5A38; font-size: clamp(14px, 3.2vw, 18px); margin-bottom: 24px; }

  @keyframes wiggle {
    0%, 100% { transform: rotate(-6deg); }
    50% { transform: rotate(6deg); }
  }
  @keyframes bounceIdle {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-6px) scale(1.02); }
  }
  @keyframes slowPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.025); }
  }
  @keyframes popIn {
    0% { transform: scale(0.7); }
    60% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }
  @keyframes wobbleFail {
    0%, 100% { transform: rotate(0deg) translateX(0); }
    20% { transform: rotate(-8deg) translateX(-6px); }
    40% { transform: rotate(7deg) translateX(6px); }
    60% { transform: rotate(-5deg) translateX(-4px); }
    80% { transform: rotate(4deg) translateX(4px); }
  }
  @keyframes confettiPop {
    0% { transform: translate(0,0) rotate(0deg) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; }
  }
  @keyframes comboGlow {
    from { box-shadow: 0 0 10px 4px rgba(255,215,0,0.4); }
    to   { box-shadow: 0 0 26px 12px rgba(255,215,0,0.75); }
  }
  @keyframes scorePulse {
    0%   { transform: scale(1); }
    45%  { transform: scale(1.13); }
    100% { transform: scale(1); }
  }
</style>

(function () {

  };

  var RING_CIRCUMFERENCE = 2 * Math.PI * 47; // ~295.31

  var RING_DOT_THRESHOLD = RING_STROKE_WIDTH / RING_CIRCUMFERENCE;

  var el = {
    scoreReadout: document.getElementById('scoreReadout'),
    scoreBox: document.getElementById('scoreBox'),
    highScoreBox: document.getElementById('highScoreBox'),
    highScoreReadout: document.getElementById('highScoreReadout'),
    timerRing: document.getElementById('timerRing'),
    ringSvg: document.getElementById('ringSvg'),
    pod: document.getElementById('pod'),
    confirmBtn: document.getElementById('confirmBtn'),
    confirmWrap: document.getElementById('confirmWrap'),
    idleOverlay: document.getElementById('idleOverlay'),
    gameoverOverlay: document.getElementById('gameoverOverlay'),
    startBtn: document.getElementById('startBtn'),
    playAgainBtn: document.getElementById('playAgainBtn'),
    finalScore: document.getElementById('finalScore'),
    gameoverSub: document.getElementById('gameoverSub'),
    dorkHeader: document.getElementById('dorkHeader'),
    dorkTitle: document.getElementById('dorkTitle')
  };

  var state = {
    gameState: 'idle',
    currentAction: null,
    score: 0,
    highScore: 0,
    muted: false,
    attempted: false,
    rafId: null,
    failTimeoutId: null,
    lastRingPaint: 0,
    ringColor: '',
    morphingOut: false,
    startTime: 0,
    duration: 3400,

  };

  try {
    var saved = localStorage.getItem('dorkit-highscore');

  } catch (e) {}

  // ---------- audio ----------
  var audioCtx = null;
  var masterBus = null;
  // Overall SFX loudness boost + a gentle compressor so sounds still read
  // loud and punchy on quiet phone speakers without clipping.
  var SFX_GAIN = 2.28;
  function sfxVol(v) { return Math.min(0.98, (v || 0.18) * SFX_GAIN); }
  function getCtx() {

        comp.knee.setValueAtTime(22, audioCtx.currentTime);
        comp.ratio.setValueAtTime(9, audioCtx.currentTime);
        comp.attack.setValueAtTime(0.002, audioCtx.currentTime);
        comp.release.setValueAtTime(0.15, audioCtx.currentTime);

  }
  function beep(freq, dur, type, vol, delay) {

      if (!ctx) return;

      osc.stop(t0 + dur);
    } catch (e) {}
  }
  function glide(freq1, freq2, dur, type, vol, delay) {

      if (!ctx) return;

      var gain = ctx.createGain();

      osc.frequency.setValueAtTime(freq1, t0);
      osc.frequency.exponentialRampToValueAtTime(freq2, t0 + dur);

      osc.connect(gain); gain.connect(masterBus || ctx.destination);
      osc.start(t0);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      osc.stop(t0 + dur);
    } catch (e) {}
  }
  // Rapid alternating-pitch flutter — used for goofy vibrato/warble effects.
  function wobble(freq, spread, count, stepDur, type, vol, delay) {
    for (var i = 0; i < count; i++) {
      var f = freq + (i % 2 === 0 ? spread : -spread);
      beep(f, stepDur, type, vol, (delay || 0) + i * stepDur * 0.8);
    }
  }
  // Each action gets its own tiny signature sound — a goofy, cartoonish
  // Bop-It-style sound chip per move, cranked up closer to the
  // voiceover's volume, rather than one generic success beep.
  var ACTION_SOUNDS = {
    SWIPE:            function () { glide(1500, 260, 0.1, 'sine', 0.36); glide(260, 1000, 0.06, 'sine', 0.3, 0.1); },
    WILLY:            function () { wobble(700, 260, 6, 0.035, 'triangle', 0.34); },
    KISS:             function () { glide(220, 650, 0.05, 'sine', 0.34); beep(1250, 0.1, 'sine', 0.36, 0.05); beep(1150, 0.05, 'sine', 0.26, 0.14); },
    HUMP:             function () { glide(150, 320, 0.08, 'square', 0.4); glide(320, 150, 0.08, 'square', 0.38, 0.09); glide(150, 300, 0.07, 'square', 0.34, 0.18); },
    TOES:             function () { beep(700, 0.05, 'triangle', 0.32); beep(950, 0.05, 'triangle', 0.32, 0.06); beep(1250, 0.07, 'triangle', 0.34, 0.12); },
    HUG:              function () { glide(400, 720, 0.14, 'triangle', 0.34); beep(880, 0.12, 'triangle', 0.32, 0.1); },
    TWIST:            function () { glide(300, 1300, 0.1, 'sawtooth', 0.32); glide(1300, 300, 0.1, 'sawtooth', 0.32, 0.1); glide(300, 900, 0.08, 'sawtooth', 0.28, 0.2); },
    SQUEEZE:          function () { glide(250, 1500, 0.13, 'square', 0.36); },
    SPANK:            function () { beep(180, 0.04, 'square', 0.42); beep(90, 0.06, 'square', 0.34, 0.04); glide(500, 950, 0.05, 'sine', 0.24, 0.1); },
    TICKLE:           function () { for (var i = 0; i < 6; i++) beep(1050 + (i % 2 ? 320 : 0), 0.03, 'triangle', 0.3, i * 0.035); },
    NOOGIE:           function () { wobble(180, 45, 6, 0.04, 'sawtooth', 0.34); },
    PINCH:            function () { beep(1650, 0.04, 'square', 0.36); beep(1950, 0.03, 'square', 0.3, 0.045); },
    POKE:             function () { beep(1150, 0.05, 'square', 0.38); beep(650, 0.03, 'square', 0.24, 0.05); },
    JORK:             function () { glide(300, 1700, 0.08, 'sawtooth', 0.34); glide(1700, 500, 0.08, 'sawtooth', 0.28, 0.09); },
    LICK:             function () { glide(400, 1450, 0.08, 'sine', 0.34); glide(1450, 1000, 0.04, 'sine', 0.24, 0.09); },
    BOOM:             function () { beep(70, 0.4, 'sine', 0.46); beep(50, 0.3, 'sine', 0.36, 0.05); beep(110, 0.07, 'square', 0.22, 0.35); },
    BULLY:            function () { beep(140, 0.1, 'sawtooth', 0.38); beep(120, 0.12, 'sawtooth', 0.36, 0.1); beep(100, 0.14, 'sawtooth', 0.34, 0.22); },
    BOOP:             function () { beep(440, 0.07, 'sine', 0.34); beep(520, 0.05, 'sine', 0.3, 0.06); beep(410, 0.06, 'sine', 0.26, 0.1); },
    MOTORBOAT:        function () { for (var i = 0; i < 8; i++) beep(130 + (i % 2) * 75, 0.03, 'sawtooth', 0.32, i * 0.028); },
    NIBBLE:           function () { for (var i = 0; i < 5; i++) beep(900 + i * 130, 0.02, 'square', 0.28, i * 0.04); },
    RASPBERRY:        function () { glide(120, 55, 0.32, 'sawtooth', 0.4); },
    CLOCKWISE:        function () { beep(523, 0.05, 'square', 0.3); beep(659, 0.05, 'square', 0.3, 0.05); beep(784, 0.05, 'square', 0.32, 0.1); beep(1046, 0.08, 'square', 0.36, 0.15); },
    COUNTERCLOCKWISE: function () { beep(1046, 0.05, 'square', 0.3); beep(784, 0.05, 'square', 0.3, 0.05); beep(659, 0.05, 'square', 0.32, 0.1); beep(523, 0.08, 'square', 0.36, 0.15); }
  };
  function comboSound() {
    // Big goofy six-note fanfare for the rare mega combo round.
    var notes = [523, 659, 784, 1046, 1319, 1568];
    notes.forEach(function (f, i) { beep(f, 0.12, 'square', 0.36, i * 0.065); });
  }
  function defaultActionSound() {
    beep(784, 0.08, 'square', 0.32);
    beep(1046, 0.08, 'square', 0.32, 0.06);
    beep(1568, 0.12, 'square', 0.36, 0.12);
  }
  function playActionSound(action) {
    if (action === 'COMBO') { comboSound(); return; }
    if (Array.isArray(action)) {
      action.forEach(function (a, i) {
        var fn = ACTION_SOUNDS[a] || defaultActionSound;
        setTimeout(fn, i * 90);
      });
      return;
    }
    var fn = ACTION_SOUNDS[action] || defaultActionSound;
    fn();
  }
  function successSound(action) {
    playActionSound(action);
  }
  function failSound() {
    beep(220, 0.3, 'sawtooth', 0.2);
    setTimeout(function () { beep(140, 0.4, 'sawtooth', 0.18); }, 90);
  }
  var cachedVoice = null;
  function pickVoice() {
    if (!window.speechSynthesis) return null;
    var voices = window.speechSynthesis.getVoices() || [];
    if (!voices.length) return null;
    // Prefer higher-quality "natural"/neural voices first (Edge, Chrome,
    // macOS/iOS premium voices) before falling back to older robotic ones.
    var preferredNames = [
      'Online (Natural)', 'Neural', 'Premium', 'Enhanced',
      'Google US English', 'Google UK English Male',
      'Samantha', 'Alex', 'Daniel', 'Aaron', 'Nicky', 'Fred',
      'Microsoft Guy', 'Microsoft Ryan', 'Microsoft Davis',
      'Microsoft David', 'Microsoft Mark', 'Gordon', 'Eddy', 'Reed'
    ];
    for (var i = 0; i < preferredNames.length; i++) {
      var match = voices.filter(function (v) { return v.name.indexOf(preferredNames[i]) !== -1; })[0];
      if (match) return match;
    }
    var maleMatch = voices.filter(function (v) {
      return /male/i.test(v.name) && !/female/i.test(v.name);
    })[0];
    if (maleMatch) return maleMatch;
    var enMatch = voices.filter(function (v) { return /^en/i.test(v.lang); })[0];
    return enMatch || voices[0];
  }
  if (window.speechSynthesis) {
    cachedVoice = pickVoice();
    window.speechSynthesis.onvoiceschanged = function () { cachedVoice = pickVoice(); };
  }
  function speak(text) {
    if (state.muted) return;
    try {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();

      // raised pitch for extra enthusiasm.

      if (cachedVoice) u.voice = cachedVoice;

  }

  function popConfetti(action) {
    var meta = META[action] || {};
    var pool = meta.confetti && meta.confetti.length ? meta.confetti : ["🎉", "✨"];
    for (var i = 0; i < 10; i++) {
      var angle = Math.random() * Math.PI * 2;
      var dist = 70 + Math.random() * 50;
      var dx = Math.cos(angle) * dist;
      var dy = Math.sin(angle) * dist;
      var rot = (Math.random() - 0.5) * 240;
      var span = document.createElement('span');
      span.className = 'confetti-piece';
      span.textContent = pool[Math.floor(Math.random() * pool.length)];
      span.style.setProperty('--dx', dx + 'px');
      span.style.setProperty('--dy', dy + 'px');
      span.style.setProperty('--rot', rot + 'deg');

        setTimeout(function () { node.remove(); }, 700);
      })(span);
    }
  }

  function pickOneAction(excluded) {
    var action;
    do {
      action = REGULAR_ACTIONS[Math.floor(Math.random() * REGULAR_ACTIONS.length)];
    } while (action === excluded && REGULAR_ACTIONS.length > 1);
    return action;
  }

  function pickDistinctActions(count, prevAction) {
    var pool = REGULAR_ACTIONS.slice();
    if (prevAction && pool.length > 1) {
      pool = pool.filter(function (action) { return action !== prevAction; });
    }

    var picked = [];
    while (picked.length < count && pool.length) {
      var index = Math.floor(Math.random() * pool.length);
      picked.push(pool.splice(index, 1)[0]);
    }

    return picked;
  }

  function pickAction(prevAction) {
    var roll = Math.random();

    // 50% single, 37% double, 10% triple, 3% long command.
    if (roll < 0.50) {
      return pickOneAction(prevAction);
    }
    if (roll < 0.87) {
      return pickDistinctActions(2, prevAction);
    }
    if (roll < 0.97) {
      return pickDistinctActions(3, prevAction);
    }
    return 'COMBO';
  }

  // Keeps "DORK IT" centered on one line: reset to the CSS-driven size,
  // then shrink in px steps only if it would actually overflow/wrap.
  function fitTitle() {
    var titleEl = el.dorkTitle;
    var container = el.dorkHeader;
    if (!titleEl || !container) return;
    // The title has a CSS transition on font-size for the idle->playing
    // size change. That transition interferes with this synchronous
    // shrink loop: reading scrollWidth right after changing font-size
    // would catch a mid-transition (not final) box size. Disable the
    // transition while we measure/adjust, then restore it.
    var prevTransition = titleEl.style.transition;
    titleEl.style.transition = 'none';
    titleEl.style.fontSize = '';
    requestAnimationFrame(function () {
      var maxWidth = container.clientWidth;
      var tries = 0;
      while (titleEl.scrollWidth > maxWidth && tries < 60) {
        var current = parseFloat(getComputedStyle(titleEl).fontSize);
        if (!current || current <= 14) break;
        titleEl.style.fontSize = (current - 1) + 'px';
        tries++;
      }

      // transition, so it doesn't animate from a stale intermediate value.
      void titleEl.offsetWidth;
      titleEl.style.transition = prevTransition;
    });

  // against the fallback font and under-shrink before Fredoka arrives.
  if (window.document && document.fonts && document.fonts.ready) {
    document.fonts.ready.then(fitTitle).catch(function () {});
  }

  // The parts of "playing vs. not playing" that change the page's overall
  // layout height (score box padding/font-size, title sizing) — split out
  // from render() so a morph can trigger this at the exact moment its own
  // transform animation starts, instead of it landing as a separate step
  // right before or right after. Both this and the box-morph transform
  // now run over the same MORPH_MS duration, so everything settles at
  // the same time with nothing left to shift afterward.
  var playingLayoutIsActive = null;
  function setPlayingLayout(playing) {
    if (playingLayoutIsActive === playing) return;
    playingLayoutIsActive = playing;
    el.scoreBox.classList.toggle('big', playing);
    el.highScoreBox.classList.toggle('big', playing);
    el.dorkTitle.classList.toggle('playing', playing);
    fitTitle();
  }

  function render(skipPlayingLayout) {
    el.scoreReadout.textContent = String(state.score).padStart(2, '0');

    var playing = state.gameState === 'playing';
    el.confirmBtn.classList.toggle('playing', playing);
    el.confirmWrap.classList.remove('pulsing');
    el.confirmBtn.classList.toggle('idle-bounce', !playing && !state.morphingOut);
    el.confirmBtn.classList.toggle('combo', playing && state.currentAction === 'COMBO');
    if (!skipPlayingLayout) setPlayingLayout(playing);

    if (playing && state.currentAction) {
      if (Array.isArray(state.currentAction)) {
        var labels = state.currentAction.map(function (key) { return META[key].label; });
        el.confirmBtn.textContent = labels.join(' AND ');
        el.confirmBtn.style.borderColor = '#3B230F';
        el.confirmBtn.classList.remove('long-label');
      } else {
        var meta = META[state.currentAction];
        el.confirmBtn.textContent = meta.label;
        el.confirmBtn.style.borderColor = '#3B230F';
        el.confirmBtn.classList.remove('long-label');
      }
    } else if (!state.morphingOut) {
      el.confirmBtn.textContent = 'READY?';
      el.confirmBtn.style.borderColor = '#3B230F';
      el.confirmBtn.classList.remove('long-label');
      // Resting ring look for idle/game-over: fully empty (drained), not
      // full. Snapping it back to "full" here was what caused a red ring
      // to flash in right as the game ended (the round's last color was
      // red, and this reset the offset to "full" before the game-over
      // box had grown large enough to cover it). The morph-in transition
      // explicitly resets the ring to full green itself, so it's still
      // shown correctly once the next round actually starts.
      el.timerRing.style.strokeDashoffset = RING_CIRCUMFERENCE;
      // NOTE: opacity is intentionally left alone here — it gets reset
      // once the button-into-box morph has actually finished, not the
      // instant we enter this state (see morphButtonIntoOverlay).
    }

    el.idleOverlay.style.display = state.gameState === 'idle' ? 'flex' : 'none';
    el.gameoverOverlay.style.display = state.gameState === 'gameover' && !state.morphingOut ? 'flex' : 'none';
    if (state.highScore > 0) {
      el.highScoreBox.style.display = 'block';
      el.highScoreReadout.textContent = String(state.highScore).padStart(2, '0');
    }
  }

  function clearTimer() {
    if (state.rafId) cancelAnimationFrame(state.rafId);
    if (state.failTimeoutId) clearTimeout(state.failTimeoutId);
    state.rafId = null;
    state.failTimeoutId = null;
  }

  var RING_START_DELAY = 200; // ms — hold the ring full before it starts draining

  var RING_FRAME_MS = 1000 / 30;
  function loop(now) {
    if (state.gameState !== 'playing') return;
    var elapsed = now - state.startTime;
    if (elapsed < 0) {
      if (!state.lastRingPaint) {
        el.timerRing.style.strokeDashoffset = 0;
        el.timerRing.style.stroke = '#4ADE9C';
        el.timerRing.style.opacity = '1';
        state.ringColor = '#4ADE9C';
        state.lastRingPaint = now;
      }
      state.rafId = requestAnimationFrame(loop);
      return;
    }
    var p = Math.max(0, 1 - elapsed / state.duration);
    if (p <= 0) { handleFail(); return; }
    // Limit SVG writes on phones. The actual deadline uses a separate
    // timeout, so the game timing remains exact even if a frame is late.
    if (now - state.lastRingPaint >= RING_FRAME_MS) {
      el.timerRing.style.strokeDashoffset = String(RING_CIRCUMFERENCE * (1 - p));
      var color = p > 0.5 ? '#4ADE9C' : (p > 0.22 ? '#FFD93D' : '#FF5C5C');
      if (color !== state.ringColor) {
        el.timerRing.style.stroke = color;
        state.ringColor = color;
      }
      el.timerRing.style.opacity = p < RING_DOT_THRESHOLD ? String(p / RING_DOT_THRESHOLD) : '1';
      state.lastRingPaint = now;
    }
    state.rafId = requestAnimationFrame(loop);
  }

  function nextRound(nextScore) {
    state.attempted = false;
    var action = pickAction(
      Array.isArray(state.currentAction) ? state.currentAction[state.currentAction.length - 1] : state.currentAction
    );
    state.currentAction = action;

    var count = Array.isArray(action) ? action.length : (action === 'COMBO' ? 4 : 1);
    // Exact round durations: single 3s, double 4s, triple 5s, long 6s.
    var baseDuration = action === 'COMBO' ? 6000 : (count === 3 ? 4000 : (count === 2 ? 3500 : 3000));
    state.duration = baseDuration * state.speedMultiplier;
    state.startTime = performance.now() + RING_START_DELAY;
    state.lastRingPaint = 0;
    state.ringColor = '#4ADE9C';

    var sayText;
    if (Array.isArray(action)) {
      sayText = action.map(function (key) { return META[key].say.replace(/!$/, ''); }).join(' and ') + '!';
    } else {
      sayText = META[action].say;
    }
    speak(sayText);

    clearTimer();
    render();
    state.rafId = requestAnimationFrame(loop);
    state.failTimeoutId = setTimeout(handleFail, RING_START_DELAY + state.duration);
  }

  function handleFail() {
    if (state.gameState !== 'playing') return;
    clearTimer();
    state.gameState = 'gameover';
    state.morphingOut = true;
    el.pod.classList.add('wobble');
    setTimeout(function () { el.pod.classList.remove('wobble'); }, 500);
    failSound();
    speak('Dorked it! Game over!');
    var isNewHigh = false;
    if (state.score > state.highScore) {
      state.highScore = state.score;
      isNewHigh = true;
      try { localStorage.setItem('dorkit-highscore', JSON.stringify(state.highScore)); } catch (e) {}
    }
    el.finalScore.textContent = state.score;
    el.gameoverSub.textContent = isNewHigh ? 'NEW HIGH SCORE!' : ('HIGH SCORE: ' + state.highScore);
    // Skip the score-box/title layout change here — it's triggered later,
    // synced to the exact moment morphButtonIntoOverlay starts growing
    // the box outward, so both animate together instead of the boxes
    // visibly shrinking early on their own.
    render(true);
    // Finish the fail wobble before starting the reverse morph. This also
    // guarantees its starting circle is measured while fully stationary.
    setTimeout(function () {
      el.pod.classList.remove('wobble');
      morphButtonIntoOverlay(el.gameoverOverlay);
    }, 500);
  }

  function handleConfirm() {
    if (state.gameState !== 'playing') return;
    if (state.attempted) return;
    state.attempted = true;
    clearTimer();
    successSound(state.currentAction);
    popConfetti(Array.isArray(state.currentAction) ? state.currentAction[0] : state.currentAction);
    el.confirmBtn.classList.add('success', 'pressed');
    el.ringSvg.classList.add('pressed');
    setTimeout(function () { el.confirmBtn.classList.remove('pressed'); el.ringSvg.classList.remove('pressed'); }, 150);
    setTimeout(function () { el.confirmBtn.classList.remove('success'); }, 350);
    state.score += 1;
    state.speedMultiplier *= 0.99; // 1% faster each success
    var ns = state.score;
    render();
    el.scoreBox.classList.remove('pulse-score');
    void el.scoreBox.offsetWidth; // restart animation
    el.scoreBox.classList.add('pulse-score');
    setTimeout(function () { nextRound(ns); }, 260);
  }

  function startGame() {
    state.score = 0;
    state.speedMultiplier = 1;
    state.gameState = 'playing';
    render();
    nextRound(0);
  }

  // ---------- overlay -> button morph transition ----------
  var FADE_MS = 150;
  var MORPH_MS = 380;
  var CROSSFADE_MS = 90;
  // The overlay box and the confirm button underneath don't land
  // perfectly on top of each other purely from their measured rects —
  // there's a small persistent vertical gap once the morph finishes.
  // Nudging the landing spot down by a few px closes it.
  var BUTTON_LANDING_NUDGE_Y = 0;

  // `transform: scale()` scales EVERYTHING about an element visually,
  // including its border — so a box with a normal 6px border shrinks to
  // a ~4px-looking border partway through the morph, then pops back to
  // a full 6px the instant the real (non-scaled) button/box underneath
  // is revealed. That pop is what read as jitter around the edges.
  // This keeps the *visual* border thickness constant throughout the
  // transform by continuously reading the live, currently-interpolating
  // scale straight off the computed transform matrix (so it automatically
  // tracks the CSS transition's actual easing, frame for frame) and
  // setting an inversely-scaled border-width to compensate.
  function keepBorderVisuallyConstant(targetEl, durationMs, knownBorderPx) {
    var trueBorderPx = knownBorderPx || parseFloat(getComputedStyle(targetEl).borderTopWidth) || 0;
    var start = performance.now();
    function frame() {
      var elapsed = performance.now() - start;
      var m = new DOMMatrix(getComputedStyle(targetEl).transform);
      var scaleX = Math.hypot(m.a, m.b) || 1;
      var scaleY = Math.hypot(m.c, m.d) || 1;
      targetEl.style.borderLeftWidth = (trueBorderPx / scaleX) + 'px';
      targetEl.style.borderRightWidth = (trueBorderPx / scaleX) + 'px';
      targetEl.style.borderTopWidth = (trueBorderPx / scaleY) + 'px';
      targetEl.style.borderBottomWidth = (trueBorderPx / scaleY) + 'px';
      if (elapsed < durationMs + 20) {
        requestAnimationFrame(frame);
      } else {
        targetEl.style.borderWidth = trueBorderPx + 'px';
        targetEl.style.borderLeftWidth = '';
        targetEl.style.borderRightWidth = '';
        targetEl.style.borderTopWidth = '';
        targetEl.style.borderBottomWidth = '';
      }
    }
    requestAnimationFrame(frame);
  }

  function morphOverlayIntoButton(overlayEl, onDone) {
    var children = Array.prototype.slice.call(overlayEl.children);
    overlayEl.style.pointerEvents = 'none';

    // Keep the real button perfectly still and hidden until the final
    // same-geometry cross-fade. This prevents an idle-bounce frame from
    // changing the target between measurement and handoff.
    el.confirmBtn.classList.remove('idle-bounce', 'pressed');
    el.confirmWrap.classList.remove('pulsing');
    el.confirmBtn.style.animation = 'none';
    el.confirmBtn.style.transition = 'none';
    el.ringSvg.style.transition = 'none';
    el.confirmBtn.style.opacity = '0';
    el.ringSvg.style.opacity = '0';

    // Reset the timer ring to its "full and green" resting look right
    // away, so as the box shrinks down and reveals the ring underneath,
    // we see green (not a leftover red from a previous fail).
    el.timerRing.style.strokeDashoffset = 0;
    el.timerRing.style.stroke = '#4ADE9C';
    el.timerRing.style.opacity = '1';

    // 1) Quickly fade out all the overlay's content.
    children.forEach(function (c) {
      c.style.transition = 'opacity ' + FADE_MS + 'ms ease';
      c.style.opacity = '0';
    });

    setTimeout(function () {
      // 2) Morph the (now-empty) box from its current rect into the
      // confirm button's circle, using its actual on-screen position so
      // this works regardless of viewport size. Animating `transform`
      // (translate + scale) instead of left/top/width/height keeps this
      // on the compositor — animating layout properties like width/height
      // forces the browser to recompute layout every frame, which is
      // what was causing the stutter.
      var startRect = overlayEl.getBoundingClientRect();
      var targetRect = el.confirmBtn.getBoundingClientRect();

      var dx = (targetRect.left + targetRect.width / 2) - (startRect.left + startRect.width / 2);
      var dy = (targetRect.top + targetRect.height / 2) - (startRect.top + startRect.height / 2) + BUTTON_LANDING_NUDGE_Y;
      var sx = targetRect.width / startRect.width;
      var sy = targetRect.height / startRect.height;

      overlayEl.style.willChange = 'transform, border-radius';
      overlayEl.style.transition = 'none';
      overlayEl.style.transform = 'translate(0px, 0px) scale(1, 1)';
      void overlayEl.offsetWidth; // flush before animating

      // Wait a frame so the identity transform above actually paints
      // before the transitioned values are applied, otherwise the
      // browser can coalesce both style writes into one frame and skip
      // straight to the end state.
      requestAnimationFrame(function () {
        overlayEl.style.transition =
          'transform ' + MORPH_MS + 'ms cubic-bezier(.4,0,.2,1), ' +
          'border-radius ' + MORPH_MS + 'ms cubic-bezier(.4,0,.2,1)';
        overlayEl.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(' + sx + ', ' + sy + ')';
        overlayEl.style.borderRadius = '50%';
        keepBorderVisuallyConstant(overlayEl, MORPH_MS);
        // Kick off the score-box/title "playing" sizing at the exact
        // same instant the box starts shrinking, using the same
        // MORPH_MS-long transition, so everything settles together
        // instead of the boxes jumping to size right after the box
        // finishes.
        setPlayingLayout(true);
      });

      setTimeout(function () {
        // 3) The main shrink transition has just finished. If the
        // concurrent score-box/title resize shifted the layout at all
        // since we last measured (e.g. a 1px rounding difference from
        // fitTitle's shrink loop), close that residual gap with one more
        // short, smooth correction instead of leaving a hard snap when
        // we swap over to the real button underneath.
        var liveTargetRect = el.confirmBtn.getBoundingClientRect();
        var liveOverlayRect = overlayEl.getBoundingClientRect();
        var driftX = (liveTargetRect.left + liveTargetRect.width / 2) - (liveOverlayRect.left + liveOverlayRect.width / 2);
        var driftY = (liveTargetRect.top + liveTargetRect.height / 2 + BUTTON_LANDING_NUDGE_Y) - (liveOverlayRect.top + liveOverlayRect.height / 2);
        var CORRECTION_MS = 60;
        overlayEl.style.transition = 'transform ' + CORRECTION_MS + 'ms ease-out';
        overlayEl.style.transform = 'translate(' + driftX + 'px, ' + driftY + 'px) ' + overlayEl.style.transform;

        setTimeout(function () {
          // 4) Start the round under the completed circle, then cross-fade
          // between two circles with identical measured geometry.
          onDone();
          overlayEl.style.display = 'flex';
          overlayEl.style.opacity = '1';
          el.confirmBtn.style.opacity = '0';
          el.ringSvg.style.opacity = '0';
          void overlayEl.offsetWidth;
          requestAnimationFrame(function () {
            overlayEl.style.transition = 'opacity ' + CROSSFADE_MS + 'ms ease';
            el.confirmBtn.style.transition = 'opacity ' + CROSSFADE_MS + 'ms ease';
            el.ringSvg.style.transition = 'opacity ' + CROSSFADE_MS + 'ms ease';
            overlayEl.style.opacity = '0';
            el.confirmBtn.style.opacity = '1';
            el.ringSvg.style.opacity = '1';
          });
          setTimeout(function () {
            overlayEl.style.cssText = '';
            overlayEl.style.display = 'none';
            children.forEach(function (c) { c.style.cssText = ''; });
            el.confirmBtn.style.cssText = '';
            el.ringSvg.style.cssText = '';
          }, CROSSFADE_MS + 20);
        }, CORRECTION_MS + 20);
      }, MORPH_MS + 40);
    }, FADE_MS + 20);
  }

  // Reverse transition: cross-fade the stationary real button into an
  // identical empty circle, then grow that same element into the box.
  // The morphing element is temporarily fixed to the viewport, so the
  // score/title layout change cannot pull it away from its start point.
  function morphButtonIntoOverlay(overlayEl) {
    var children = Array.prototype.slice.call(overlayEl.children);
    var startRect = el.confirmBtn.getBoundingClientRect();

    el.confirmBtn.classList.remove('idle-bounce', 'pressed', 'success');
    el.confirmWrap.classList.remove('pulsing');
    el.confirmBtn.style.animation = 'none';

    // Establish the game-over layout while the real button is still in
    // its old spot. The fixed morph circle will cover this layout handoff.
    setPlayingLayout(false);
    overlayEl.style.cssText = '';
    overlayEl.style.display = 'flex';
    overlayEl.style.pointerEvents = 'none';
    overlayEl.style.opacity = '0';
    overlayEl.style.transition = 'none';
    overlayEl.style.transform = 'none';
    children.forEach(function (c) {
      c.style.transition = 'none';
      c.style.opacity = '0';
    });
    void overlayEl.offsetWidth;
    var targetRect = overlayEl.getBoundingClientRect();
    var dx = (startRect.left + startRect.width / 2) - (targetRect.left + targetRect.width / 2);
    var dy = (startRect.top + startRect.height / 2) - (targetRect.top + targetRect.height / 2);
    var sx = startRect.width / targetRect.width;
    var sy = startRect.height / targetRect.height;
    var trueBorderPx = parseFloat(getComputedStyle(overlayEl).borderTopWidth) || 0;

    // Pin the overlay's final box rect, then transform that box so its
    // painted border box exactly matches the gameplay button.
    overlayEl.style.position = 'fixed';
    overlayEl.style.inset = 'auto';
    overlayEl.style.left = targetRect.left + 'px';
    overlayEl.style.top = targetRect.top + 'px';
    overlayEl.style.width = targetRect.width + 'px';
    overlayEl.style.height = targetRect.height + 'px';
    overlayEl.style.zIndex = '60';
    overlayEl.style.willChange = 'transform, border-radius';
    overlayEl.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(' + sx + ', ' + sy + ')';
    overlayEl.style.borderRadius = '50%';
    overlayEl.style.borderLeftWidth = (trueBorderPx / sx) + 'px';
    overlayEl.style.borderRightWidth = (trueBorderPx / sx) + 'px';
    overlayEl.style.borderTopWidth = (trueBorderPx / sy) + 'px';
    overlayEl.style.borderBottomWidth = (trueBorderPx / sy) + 'px';

    el.confirmBtn.style.transition = 'none';
    el.ringSvg.style.transition = 'none';
    el.confirmBtn.style.opacity = '1';
    el.ringSvg.style.opacity = '1';
    void overlayEl.offsetWidth;

    // Cross-fade only while both circles have identical geometry. This
    // prevents the dark flash and makes the reverse morph unmistakable.
    requestAnimationFrame(function () {
      overlayEl.style.transition = 'opacity ' + CROSSFADE_MS + 'ms ease';
      el.confirmBtn.style.transition = 'opacity ' + CROSSFADE_MS + 'ms ease';
      el.ringSvg.style.transition = 'opacity ' + CROSSFADE_MS + 'ms ease';
      overlayEl.style.opacity = '1';
      el.confirmBtn.style.opacity = '0';
      el.ringSvg.style.opacity = '0';
    });

    setTimeout(function () {
      overlayEl.style.transition =
        'transform ' + MORPH_MS + 'ms cubic-bezier(.4,0,.2,1), ' +
        'border-radius ' + MORPH_MS + 'ms cubic-bezier(.4,0,.2,1)';
      overlayEl.style.transform = 'translate(0px, 0px) scale(1, 1)';
      overlayEl.style.borderRadius = '24px';
      keepBorderVisuallyConstant(overlayEl, MORPH_MS, trueBorderPx);

      setTimeout(function () {
        // The fixed and normal overlay rects are the same, so this is a
        // style cleanup rather than a positional correction or snap.
        overlayEl.style.transition = 'none';
        overlayEl.style.transform = 'none';
        overlayEl.style.position = '';
        overlayEl.style.inset = '';
        overlayEl.style.left = '';
        overlayEl.style.top = '';
        overlayEl.style.width = '';
        overlayEl.style.height = '';
        overlayEl.style.zIndex = '';
        overlayEl.style.willChange = '';
        overlayEl.style.borderWidth = '';
        overlayEl.style.borderLeftWidth = '';
        overlayEl.style.borderRightWidth = '';
        overlayEl.style.borderTopWidth = '';
        overlayEl.style.borderBottomWidth = '';
        overlayEl.style.opacity = '1';

        state.morphingOut = false;
        el.confirmBtn.style.cssText = '';
        el.ringSvg.style.cssText = '';
        el.timerRing.style.opacity = '1';
        render();

        children.forEach(function (c) {
          c.style.transition = 'opacity ' + FADE_MS + 'ms ease';
          c.style.opacity = '1';
        });
        setTimeout(function () {
          overlayEl.style.pointerEvents = '';
          overlayEl.style.transition = '';
          children.forEach(function (c) { c.style.cssText = ''; });
        }, FADE_MS + 20);
      }, MORPH_MS + 30);
    }, CROSSFADE_MS + 20);
  }

  // ---------- controls ----------
  el.startBtn.addEventListener('click', function (e) {
    e.preventDefault();
    morphOverlayIntoButton(el.idleOverlay, startGame);
  });
  el.playAgainBtn.addEventListener('click', function (e) {
    e.preventDefault();
    morphOverlayIntoButton(el.gameoverOverlay, startGame);
  });
  // Tap/click ANYWHERE on the screen completes the action — not just the
  // circle — so it's easy to keep up during fast, frantic play.
  var lastTapTime = 0;
  document.addEventListener('touchstart', function (e) {
    if (state.gameState !== 'playing') return;
    e.preventDefault();
    lastTapTime = Date.now();
    handleConfirm();
  }, { passive: false });
  document.addEventListener('click', function (e) {
    if (state.gameState !== 'playing') return;
    if (Date.now() - lastTapTime < 500) {
      e.preventDefault();
      return;
    }
    handleConfirm();
  }, true);

  // Fully block scroll/drag gestures everywhere on the page (not just
  // touchstart) so Safari's chrome never has a reason to collapse or
  // expand mid-swipe — that resize is what exposes white space.
  // Defensive scroll reset for iOS Safari — in case any gesture slips
  // through, snap the page back to (0,0) immediately so nothing can
  // drift and expose space beyond the oversized background fill.
  function resetScroll() { window.scrollTo(0, 0); }
  window.addEventListener('load', resetScroll);
  window.addEventListener('orientationchange', function () { setTimeout(resetScroll, 50); });
  window.addEventListener('resize', resetScroll);
  document.addEventListener('scroll', resetScroll, { passive: true });

  document.addEventListener('touchmove', function (e) {
    e.preventDefault();
  }, { passive: false });

  window.addEventListener('keydown', function (e) {
    if (state.gameState !== 'playing') return;
    if (e.key === ' ' || e.key === 'Spacebar' || e.key === 'Enter') {
      e.preventDefault();
      handleConfirm();
    }
  });

  render();
})();
</script>
</body>
</html>
