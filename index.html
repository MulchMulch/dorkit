<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    height: 100dvh;
    width: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    background: #8FD3F4;
    font-family: 'Baloo 2', sans-serif;
    color: #3B230F;
    /* Matches the thickness of the black outline drawn around the
       responsive "DORK IT" title (the outline extends to 0.065em).
       Used as the border-width for every black-bordered box
       and button so they all read as the same stroke weight. */
    --dork-border-w: clamp(3px, 1vw, 6px);
    /* Score cards use a deliberately lighter outline: exactly 75% of
       the shared border scale, without changing any other game border. */
    --dork-score-border-w: clamp(2.25px, 0.75vw, 4.5px);
  }
  /* Oversized fixed background element — deliberately bigger than the
     viewport in every direction and pinned with position:fixed so that
     iOS Safari's address bar/toolbar collapsing or expanding during a
     swipe attempt can never reveal white space behind the page. This is
     a real DOM element (not a pseudo-element) placed first in <body>
     so it can't be affected by any ancestor positioning quirks. */
  #bgFill {
    position: fixed;
    top: -25vh; left: -25vw;
    width: 150vw; height: 150vh;
    background: #8FD3F4;
    pointer-events: none;
    contain: strict;
  }
  /* Same oversized/fixed trick as #bgFill, painted on top of it (later in
     DOM order, same default stacking level) so the tiled icon pattern
     sits above the gradient but still stays fully behind the app
     content. IMPORTANT: no negative z-index here — a position:fixed
     element with z-index < 0 renders BEHIND the root canvas background
     painted by html/body's own "background", making it invisible no
     matter what it contains. Leaving z-index at its default (auto) and
     relying on DOM order keeps these layers correctly stacked: behind
     .dork-app, but on top of the page's canvas background. */
  #logoTile {
    position: fixed;
    top: -25vh; left: -25vw;
    width: 150vw; height: 150vh;
    pointer-events: none;
    contain: strict;
  }
  #logoTile svg { display: block; width: 100%; height: 100%; }
  .logo-scroll-layer {
    will-change: transform;
    transform-origin: 0 0;
  }
  .logo-scroll-right,
  .logo-scroll-left { animation: logoRowsRight 30s linear infinite; }
  .logo-icon-glow {
    fill: #FFFFFF;
    fill-opacity: 1;
    opacity: 0;
    pointer-events: none;
  }
  @keyframes logoRowsRight {
    from { transform: translateX(-225px); }
    to { transform: translateX(0); }
  }
  /* These solid strips cover only artwork that would actually be clipped at
     a viewport edge. Empty padding inside a 75px pattern row is left alone. */
  .logo-row-mask {
    position: fixed;
    left: 0; right: 0;
    height: 0;
    background: #8FD3F4;
    pointer-events: none;
    contain: strict;
  }
  #logoTopMask { top: 0; }
  #logoBottomMask { bottom: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  /* position:relative (no offset, so no layout change) is required here:
     #bgFill/#logoTile are position:fixed. Per CSS stacking rules, ANY
     positioned element (even with z-index:auto) paints above static
     in-flow content in the same stacking context, regardless of DOM
     order. Without this, .dork-app (static) would render BEHIND the
     fixed background layers no matter what order they're written in,
     hiding the whole app. Making .dork-app positioned too puts it in
     the same z-index:auto stacking bucket as the background layers,
     where DOM order (declared after them) correctly wins. */
  .dork-app { position: relative; width: 100%; max-width: 640px; min-width: 0; user-select: none; -webkit-user-select: none; }

  .dork-header {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 18px;
    width: clamp(240px, 82vmin, 640px); max-width: 100%; min-width: 0;
    transform: translate3d(0, -8px, 0);
    transition: transform 380ms cubic-bezier(.4,0,.2,1);
    will-change: transform;
    /* Text shadows are paint outside the measured glyph box. Keeping this
       visible prevents the outermost black title stroke from being clipped. */
    overflow: visible;
  }
  /* The button wrapper rests 8px above the center of its reserved area.
     Moving the header up by twice that amount makes its visual clearance
     match the clearance between the button and the lower score cards. */
  .dork-header.playing { transform: translate3d(0, -16px, 0); }

    font-family: 'Fredoka One', 'Baloo 2', sans-serif; font-weight: 400; font-size: clamp(64px, 22vw, 180px);

       offsets (in em, so it scales with font-size) rather than
       -webkit-text-stroke — a real stroke self-intersects and breaks on
       glyphs like "R" in this font. The 8-point version left a visibly
       faceted/jagged ring around curves (O, D); using many more points
       per ring (16 inner, 28 outer) makes each ring dense enough to
       read as a smooth curve instead of a polygon. The drop shadow

  .dork-title-head > span {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    background: var(--head-art) center / contain no-repeat;
    pointer-events: none;
  }
  /* Two black silhouette copies reproduce the title's solid outer stroke
     and its straight-down drop shadow without blurring the hand-drawn head. */
  .dork-title-head .head-drop {
    z-index: 0;
    filter: brightness(0);
    transform: translateY(0.085em) scale(1.15);
    transform-origin: center;
  }
  .dork-title-head .head-stroke {
    z-index: 1;
    filter: brightness(0);
    transform: scale(1.15);
    transform-origin: center;
  }
  .dork-title-head .head-art { z-index: 2; }
  .dork-title-head::before,
  .dork-title-head::after {
    content: "";
    position: absolute;
    top: 57.2%;
    z-index: 3;
    width: 16%;
    height: 14.7%;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255,127,162,0.86) 0%,
      rgba(255,127,162,0.68) 38%,
      rgba(255,127,162,0.28) 64%,
      rgba(255,127,162,0) 82%);
    opacity: 0;
    pointer-events: none;
  }
  .dork-title-head::before { left: 19%; }
  .dork-title-head::after { right: calc(19% + 5px); }
  .dork-title-head.blushing::before,
  .dork-title-head.blushing::after {
    /* 200ms fade in + 2s fully visible + 300ms fade out. */
    animation: titleHeadBlush 2.5s linear forwards;
  }
  .dork-header.playing .dork-title-head {
    pointer-events: none;
    cursor: default;
  }
  .dork-subtitle {
    position: absolute;
    left: 50%;
    bottom: -5px;
    z-index: 5;
    display: block;
    transform: translateX(-50%);
    pointer-events: auto;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    white-space: nowrap;
    text-align: center;
    color: #FFF8ED;
    font-family: 'Fredoka One', 'Baloo 2', sans-serif;
    font-size: 16px;
    font-weight: 400;
    line-height: 1;
    -webkit-text-stroke: 0.13em #000;
    paint-order: stroke fill;
    filter: drop-shadow(0 0.1275em 0 #000);
  }
  .dork-header.playing .dork-subtitle { pointer-events: none; }
  .dork-subbar { position: relative; display: flex; align-items: center; justify-content: center; gap: 28px; margin-top: 18px; }
  .dork-readout {
    font-family: 'Fredoka', sans-serif; font-weight: 700;
    position: relative;
    background: transparent;
    border: var(--dork-score-border-w) solid transparent;
    box-shadow: none;
    padding: 13px 24px; border-radius: 22px; font-size: clamp(22px, 5.4vw, 32px);
    transform: scale(0.62);
    transition: transform 380ms cubic-bezier(.4,0,.2,1);
    will-change: transform;
  }
  /* Anchor each card at its inner edge. Shrinking therefore preserves the
     exact visual gap while the full-size layout footprint stays unchanged. */
  #scoreBox { transform-origin: right center; }
  #highScoreBox {
    transform-origin: left center;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    outline: none;
  }
  .dork-readout b {
    color: #FF5FA2;
    display: inline-block;
    min-width: 2ch;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .dork-readout-content {
    position: relative;
    z-index: 1;
  }
  .dork-score-handdrawn {
    position: absolute;
    inset: calc(var(--dork-score-border-w) * -0.5);
    width: calc(100% + var(--dork-score-border-w));
    height: calc(100% + var(--dork-score-border-w));
    overflow: visible;
    pointer-events: none;
    z-index: 0;
  }
  .dork-score-handdrawn .sketch-shadow {
    fill: rgba(59,35,15,0.3);
    stroke: none;
  }
  .dork-score-handdrawn .sketch-face {
    fill: #FFF8ED;
    stroke: #3B230F;
    stroke-width: var(--dork-score-border-w);
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
  }
  .dork-readout.big {
    /* Transform-only growth gives the original small-to-large appearance
       without changing layout dimensions or re-centering the game. */
    padding: 13px 24px; border-radius: 22px; font-size: clamp(22px, 5.4vw, 32px);
    transform: scale(1); box-shadow: none;
  }
  .dork-readout.pulse-score {
    animation: scorePulse 0.32s ease-in-out;
    transform-origin: center center;
    will-change: transform;
  }

  .dork-relative {
    position: relative;
    min-height: clamp(308px, 94.6vmin, 770px);
    display: flex; align-items: center; justify-content: center;
  }
  .dork-pod {
    position: relative;
    width: 100%;
    max-width: clamp(260px, 90vmin, 700px);
    display: flex; flex-direction: column; align-items: center;
  }
  .dork-pod.wobble { animation: wobbleFail 0.5s ease; }

  .dork-confirm-wrap {
    position: relative;
    width: clamp(240px, 82vmin, 640px);
    height: clamp(240px, 82vmin, 640px);
    display: flex; align-items: center; justify-content: center;
    transform-origin: center;
    transform: translateY(-8px);
    isolation: isolate;
  }
  .dork-confirm-wrap.pulsing { animation: none; }
  .dork-ring {
    /* Give only the timer layer 4% of extra room on every side. The
       button, wrapper, timer core, and all layout geometry stay unchanged. */
    position: absolute; inset: -4%; width: auto; height: auto;
    pointer-events: none; z-index: 1;
    transition: transform 90ms ease;
    contain: strict;
  }
  .dork-ring.pressed { transform: none; }
  .dork-ring-fg {
    display: block; width: 100%; height: 100%;
    overflow: visible;
    /* Keep the native SVG animation on an isolated compositing surface. */
    transform: translateZ(0);
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
  }
  .dork-ring-arc {
    color: #35E892;
    fill: none;
    stroke-linecap: round;
    stroke-dasharray: 292.17;
    stroke-dashoffset: 292.17;
    opacity: 0;
    shape-rendering: geometricPrecision;
  }
  /* Two extremely faint, slightly wider copies create a soft dark fade
     immediately around the live arc. They inherit the arc's dash animation,
     so no track remains behind after that part of the timer has elapsed. */
  .dork-ring-halo-outer {
    fill: none;
    stroke: #3B230F;
    stroke-width: 11;
    opacity: 0.055;
  }
  .dork-ring-halo-inner {
    fill: none;
    stroke: #3B230F;
    stroke-width: 8.5;
    opacity: 0.14;
  }
  .dork-ring-progress {
    fill: none;
    stroke: currentColor;
    /* One unit thicker inward while retaining the original outer radius. */
    stroke-width: 7;
  }

  /* The reverse morph uses a viewport-fixed tracker plus a nested shell.
     The tracker follows the box's live resting position while the page
     re-centers; the shell independently grows from circle to box. */
  .dork-morph-tracker {
    position: fixed; left: 0; top: 0; z-index: 60;
    pointer-events: none; will-change: transform, opacity;
  }
  .dork-morph-shell {
    position: absolute; inset: 0; box-sizing: border-box;
    border: var(--dork-border-w) solid #3B230F;
    border-radius: 50%; background: #FFF8ED;
    transform-origin: center center;
    will-change: transform;
  }
  .dork-morph-shell.handdrawn-shell {
    border-color: transparent;
    background: transparent;
  }

  .dork-confirm {
    position: relative;
    z-index: 2;
    width: 88%;
    height: 88%;
    border-radius: 9999px;
    background: transparent;
    border-style: solid;
    border-width: var(--dork-border-w);
    border-color: transparent;
    color: #3B230F;
    font-family: 'Fredoka', sans-serif; font-weight: 700;
    font-size: clamp(22px, 6vmin, 44px);
    letter-spacing: 0.5px;
    line-height: 1.25;
    padding: 0 6%;
    cursor: default;
    -webkit-appearance: none;
    appearance: none;
    transition: transform 90ms ease, border-color 150ms ease, box-shadow 150ms ease;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  .dork-confirm.playing { cursor: pointer; }
  .dork-confirm.idle-bounce { animation: bounceIdle 1.8s ease-in-out infinite; }
  .dork-confirm.pressed { transform: none; }
  .dork-confirm.success { animation: coverRing 0.8s cubic-bezier(.2,.8,.2,1); }
  .dork-confirm.long-label { font-size: clamp(20px, 5.4vmin, 40px); overflow-wrap: anywhere; word-break: normal; }
  .dork-confirm.combo {
    box-shadow: 0 0 16px 7px rgba(255,215,0,0.52);
    animation: none;
  }
  .dork-confirm.combo.success { animation: coverRing 0.8s cubic-bezier(.2,.8,.2,1); }
  .dork-confirm-label {
    position: relative;
    z-index: 1;
    display: inline-block;
    max-width: 100%;
    transform-origin: center center;
    will-change: transform;
  }
  .dork-button-handdrawn {
    position: absolute;
    inset: calc(var(--dork-border-w) * -0.5);
    width: calc(100% + var(--dork-border-w));
    height: calc(100% + var(--dork-border-w));
    overflow: visible;
    pointer-events: none;
    z-index: 0;
  }
  .dork-button-handdrawn path {
    fill: #FFF8ED;
    stroke: #3B230F;
    stroke-width: var(--dork-border-w);
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
    shape-rendering: geometricPrecision;
  }
  .dork-confirm.playing .dork-confirm-label {
    /* 2.5s each way gives the instruction text a slow 5s round trip. */
    animation: instructionTeeter 2.5s cubic-bezier(.45,0,.55,1) infinite alternate;
  }

  .confetti-piece {
    position: absolute; left: 50%; top: 50%; z-index: 40;
    margin-left: -0.5em; margin-top: -0.5em;
    font-size: clamp(48px, 9vmin, 84px); pointer-events: none;
    will-change: transform, opacity;
  }
  .combo-milestone {
    position: absolute; left: 50%; bottom: calc(100% + 29px); z-index: 50;
    pointer-events: none; white-space: nowrap;
    font-family: 'Fredoka', sans-serif; font-weight: 700;
    font-size: clamp(24px, 7vmin, 48px); color: #FFD93D;
    -webkit-text-stroke: clamp(1.5px, 0.45vmin, 3px) #3B230F;
    paint-order: stroke fill;
    text-shadow: 0 4px 0 rgba(59,35,15,0.24);
    transform-origin: center center;
    will-change: transform, opacity;
    opacity: 0;
    animation:
      comboMilestonePop 1.05s cubic-bezier(.22,.61,.36,1) forwards,
      comboMilestoneFade 1.05s linear forwards;
  }
  .combo-milestone::before,
  .combo-milestone::after {
    content: "✦";
    position: absolute;
    color: #FFF8ED;
    font-size: 0.86em;
    line-height: 1;
    -webkit-text-stroke: 0;
    text-shadow: 0 0 8px rgba(255,217,61,1);
    opacity: 0;
    animation: comboSparkleTwinkle 0.9s ease-out forwards;
  }
  .combo-milestone::before { left: -1.15em; top: -0.48em; }
  .combo-milestone::after {
    right: -1.15em; bottom: -0.42em;
    animation-delay: 0.13s;
  }
  .combo-sparkle-canvas {
    position: absolute;
    left: 50%; top: 50%;
    width: 320px; height: 240px;
    transform: translate(-50%, -50%);
    z-index: -1;
    pointer-events: none;
  }

  .version-indicator {
    position: fixed;
    left: max(7px, env(safe-area-inset-left));
    bottom: max(5px, env(safe-area-inset-bottom));
    z-index: 10;
    pointer-events: none;
    color: rgba(255,255,255,0.25);
    font-family: 'Fredoka', sans-serif;
    font-size: clamp(14px, 3.6vw, 20px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: 0.06em;
    user-select: none;
    -webkit-user-select: none;
  }

  .dork-overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 0 8%;
    border-radius: 24px;
    background: transparent;
    border-style: solid; border-width: var(--dork-border-w); border-color: transparent;
    z-index: 20;
  }
  /* This vector path supplies the stationary box's cream fill and visibly
     hand-drawn outline. It never participates in layout, so the existing
     morph measurements remain exact. */
  .dork-handdrawn-border {
    position: absolute;
    inset: calc(var(--dork-border-w) * -0.5);
    width: calc(100% + var(--dork-border-w));
    height: calc(100% + var(--dork-border-w));
    overflow: visible;
    pointer-events: none;
    z-index: 0;
    opacity: 1;
  }
  .dork-handdrawn-border path {
    fill: #FFF8ED;
    stroke: #3B230F;
    stroke-width: var(--dork-border-w);
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
    shape-rendering: geometricPrecision;
  }
  .dork-overlay > :not(.dork-handdrawn-border) {
    position: relative;
    z-index: 1;
  }
  .dork-opening-letter {
    display: block;
    width: min(100%, 470px);
    height: auto;
    max-height: min(72%, 430px);
    object-fit: contain;
    margin: 0 auto 14px;
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .dork-btn {
    font-family: 'Fredoka', sans-serif; font-weight: 700; background: #4ADE9C; color: #1F3B2C;
    border: var(--dork-border-w) solid #3B230F; box-shadow: 5px 5px 0 rgba(59,35,15,0.35);
    padding: 14px 34px; border-radius: 999px; font-size: clamp(16px, 3.8vw, 21px); cursor: pointer; margin-bottom: 16px;
  }
  .dork-highscore { font-family: 'Fredoka', sans-serif; font-weight: 700; color: #7A5A38; font-size: clamp(14px, 3.2vw, 18px); margin-top: 8px; }

  .dork-gameover-title {
    font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: clamp(30px, 7vw, 42px); color: #000; margin-bottom: 8px;
  }
  .dork-gameover-score { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: clamp(34px, 8vw, 48px); color: #3B230F; margin-bottom: 4px; }
  .dork-gameover-sub { font-family: 'Baloo 2', sans-serif; font-weight: 600; color: #7A5A38; font-size: clamp(14px, 3.2vw, 18px); margin-bottom: 24px; }

  @keyframes bounceIdle {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-6px) scale(1.02); }
  }
  @keyframes slowPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.025); }
  }
  @keyframes instructionTeeter {
    from { transform: rotate(-7deg); }
    to { transform: rotate(7deg); }
  }
  @keyframes titleHeadBlush {
    0%   { opacity: 0; }
    8%   { opacity: 0.86; }
    88%  { opacity: 0.86; }
    100% { opacity: 0; }
  }
  @keyframes coverRing {
    0% { transform: scale(1); }
    52.5% { transform: scale(1.22); }
    100% { transform: scale(1); }
  }
  @keyframes wobbleFail {
    0%, 100% { transform: rotate(0deg) translateX(0); }
    20% { transform: rotate(-8deg) translateX(-6px); }
    40% { transform: rotate(7deg) translateX(6px); }
    60% { transform: rotate(-5deg) translateX(-4px); }
    80% { transform: rotate(4deg) translateX(4px); }
  }
  @keyframes confettiPop {
    0% { transform: translate(0,0) rotate(0deg) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; }
  }
  @keyframes comboMilestonePop {
    0%   { transform: translate(-50%, 12px) scale(0.82) rotate(-3deg); }
    30%  { transform: translate(-50%, 0) scale(1.06) rotate(1deg); }
    62%  { transform: translate(-50%, -5px) scale(1) rotate(0deg); }
    100% { transform: translate(-50%, -38px) scale(0.96) rotate(0deg); }
  }
  @keyframes comboMilestoneFade {
    0%   { opacity: 0; }
    12%  { opacity: 0.25; }
    30%  { opacity: 1; }
    72%  { opacity: 1; }
    100% { opacity: 0; }
  }
  @keyframes comboSparkleTwinkle {
    0%   { transform: scale(0.25) rotate(-25deg); opacity: 0; }
    28%  { transform: scale(1.2) rotate(8deg); opacity: 1; }
    62%  { transform: scale(0.82) rotate(22deg); opacity: 0.85; }
    100% { transform: scale(0.25) rotate(42deg); opacity: 0; }
  }
  @keyframes scorePulse {
    0%   { transform: scale(1); }
    45%  { transform: scale(1.13); }
    100% { transform: scale(1); }
  }
</style>
</head>

    }
  }

  function handleConfirm(origin) {
    if (state.gameState !== 'playing') return;
    if (state.attempted || state.buttonSettling) return;
    state.attempted = true;
    state.buttonSettling = true;
    var completedAction = state.currentAction;
    var pressOrigin = origin && isFinite(origin.clientX) && isFinite(origin.clientY) ? {
      clientX: origin.clientX,
      clientY: origin.clientY
    } : null;
    // Stop countdown/failure scheduling but preserve the exact remaining
    // ring visible until the button has grown over it.
    clearTimer(true);

    // Apply the visual response first. The COMBO fanfare and confetti are
    // deliberately deferred until after the next paint so they cannot
    // delay the press feedback.
    el.confirmBtn.classList.add('pressed');
    el.ringSvg.classList.add('pressed');
    setTimeout(function () { el.confirmBtn.classList.remove('pressed'); el.ringSvg.classList.remove('pressed'); }, 150);
    var previousHighScore = state.highScore;
    state.score += 1;
    var scoreIsHigh = state.score >= previousHighScore;
    if (state.score > state.highScore) {
      state.highScore = state.score;
      state.beatHighScore = true;
      try { localStorage.setItem('dorkit-highscore', JSON.stringify(state.highScore)); } catch (e) {}
    }
    state.speedMultiplier *= 0.99; // 1% faster each success
    var ns = state.score;
    render();

    pulseReadout(el.scoreBox, 'scorePulseAnimation');
    if (scoreIsHigh) pulseReadout(el.highScoreBox, 'highScorePulseAnimation');

    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        successSound(completedAction);
        popConfetti(Array.isArray(completedAction) ? completedAction[0] : completedAction, pressOrigin);
        if (ns > 0 && ns % 5 === 0) showComboMilestone(ns);
      });
    });
    animateButtonOverRing(function () {
      // This draw happens only after the button fully covers the timer.
      drawTimerRing(1, '#35E892', 1);
    }, function () {
      // Start the next instruction and its speech 200ms before the button
      // reaches its final shrink frame. The countdown still waits for speech.
      nextRound(ns, true);
    }, function () {
      state.buttonSettling = false;
      el.confirmBtn.classList.remove('success', 'pressed');
      el.ringSvg.classList.remove('pressed');
    });
  }

  function startGame() {
    clearBackgroundGlows();
    clearTitleBlush();
    state.buttonSettling = false;
    state.score = 0;
    state.speedMultiplier = 1;
    state.beatHighScore = false;
    state.gameState = 'playing';
    startSound();
    render();
    nextRound(0);
  }

  // ---------- overlay -> button morph transition ----------
  var FADE_MS = 150;
  var MORPH_MS = 380;
  var CROSSFADE_MS = 90;
  /* Both paths begin at top-center and travel clockwise through the same
     twelve cubic segments. Matching every perimeter point removes the old
     rotational illusion, while the circle's tangent-matched controls create
     a genuinely smooth circumference at the end of the morph. */
  var HAND_BOX_PATH = 'M 50 1.4 C 63 1.1 78 1.8 94 1.3 C 96.8 1.1 98.5 2.6 98.4 5.2 C 99.1 22 98.1 39 98.8 50 C 99.2 65 98.1 83 98.7 94.8 C 98.9 97.5 97.4 98.6 94.8 98.3 C 79 99.1 64 97.9 50 98.5 C 36 99.1 21 98 5.2 98.7 C 2.5 98.8 1.6 97.3 1.8 94.7 C 0.9 78 2.1 61 1.3 50 C 0.7 35 2.3 13 1.5 5.2 C 1.3 2.4 2.7 1.4 5.1 1.7 C 20 0.9 35 2 50 1.4 Z';
  var CIRCLE_PATH = 'M 50 1 C 58.601 1 67.051 3.264 74.5 7.565 C 81.949 11.866 88.134 18.051 92.435 25.5 C 96.736 32.949 99 41.399 99 50 C 99 58.601 96.736 67.051 92.435 74.5 C 88.134 81.949 81.949 88.134 74.5 92.435 C 67.051 96.736 58.601 99 50 99 C 41.399 99 32.949 96.736 25.5 92.435 C 18.051 88.134 11.866 81.949 7.565 74.5 C 3.264 67.051 1 58.601 1 50 C 1 41.399 3.264 32.949 7.565 25.5 C 11.866 18.051 18.051 11.866 25.5 7.565 C 32.949 3.264 41.399 1 50 1 Z';
  var GAME_CIRCLE_PATH = 'M 50 1.4 C 58.2 0.9 66.8 3.7 74.7 7.7 C 81.8 12.1 88.5 18.2 92.3 25.8 C 96.9 32.7 98.4 41.4 98.8 50 C 99.1 58.6 96.4 67.3 92.6 74.3 C 88 82 81.7 87.8 74.3 92.6 C 67.2 96.4 58.7 99.2 50 98.7 C 41.3 99.2 32.7 96.1 25.7 92.6 C 18 88.3 12.2 81.6 7.6 74.4 C 3.5 67.3 0.9 58.7 1.4 50 C 0.8 41.3 3.6 32.8 7.7 25.6 C 11.8 18.1 18.3 12.2 25.6 7.6 C 32.9 3.2 41.6 1.1 50 1.4 Z';

  document.querySelectorAll('.dork-handdrawn-border path').forEach(function (path) {
    path.setAttribute('d', HAND_BOX_PATH);
  });

  function morphPath(pathEl, fromD, toD, durationMs) {
    if (!pathEl) return;
    var numberPattern = /-?(?:\d*\.)?\d+(?:e[-+]?\d+)?/gi;
    var from = (fromD.match(numberPattern) || []).map(Number);
    var to = (toD.match(numberPattern) || []).map(Number);
    if (from.length !== to.length) {
      pathEl.setAttribute('d', toD);
      return;
    }
    pathEl.setAttribute('d', fromD);
    var start = performance.now();

    // Solve cubic-bezier(.4, 0, .2, 1) so the outline reshaping stays locked
    // to the existing transform transition instead of appearing to lag it.
    function morphEase(x) {
      var t = x;
      for (var n = 0; n < 5; n++) {
        var mt = 1 - t;
        var estimate = 3 * mt * mt * t * 0.4 + 3 * mt * t * t * 0.2 + t * t * t;
        var derivative = 3 * mt * mt * 0.4 + 6 * mt * t * (0.2 - 0.4) + 3 * t * t * (1 - 0.2);
        if (Math.abs(derivative) < 0.0001) break;
        t -= (estimate - x) / derivative;
        t = Math.max(0, Math.min(1, t));
      }
      return 3 * (1 - t) * t * t + t * t * t;
    }

    function frame(now) {
      var raw = Math.min(1, (now - start) / durationMs);
      var eased = morphEase(raw);
      var index = 0;
      var d = fromD.replace(numberPattern, function () {
        var value = from[index] + (to[index] - from[index]) * eased;
        index += 1;
        return value.toFixed(3);
      });
      pathEl.setAttribute('d', d);
      if (raw < 1) requestAnimationFrame(frame);
      else pathEl.setAttribute('d', toD);
    }
    requestAnimationFrame(frame);
  }
  // The overlay box and the confirm button underneath don't land
  // perfectly on top of each other purely from their measured rects —
  // there's a small persistent vertical gap once the morph finishes.
  // Nudging the landing spot down by a few px closes it.
  var BUTTON_LANDING_NUDGE_Y = 0;

  function morphOverlayIntoButton(overlayEl, onDone) {
    layoutMorphActive = true;
    var handPath = overlayEl.querySelector('.dork-handdrawn-border path');
    var children = Array.prototype.slice.call(overlayEl.children).filter(function (child) {
      return !child.classList.contains('dork-handdrawn-border');
    });
    overlayEl.style.pointerEvents = 'none';

    // Keep the real button perfectly still and hidden until the final
    // same-geometry cross-fade. This prevents an idle-bounce frame from
    // changing the target between measurement and handoff.
    el.confirmBtn.classList.remove('idle-bounce', 'pressed');
    el.confirmWrap.classList.remove('pulsing');
    el.confirmBtn.style.animation = 'none';
    el.confirmBtn.style.transition = 'none';
    el.ringSvg.style.transition = 'none';
    el.confirmBtn.style.opacity = '0';
    el.ringSvg.style.opacity = '0';

    // Keep the ring empty during the geometry morph. Once the new round
    // starts, showWaitingRing() fades in a full green ring immediately,
    // while its countdown remains paused for the spoken command.
    clearTimerRing();

    // 1) Quickly fade out all the overlay's content.
    children.forEach(function (c) {
      c.style.transition = 'opacity ' + FADE_MS + 'ms ease';
      c.style.opacity = '0';
    });

    setTimeout(function () {
      // 2) Morph the (now-empty) box from its current rect into the
      // confirm button's circle, using its actual on-screen position so
      // this works regardless of viewport size. Animating `transform`
      // (translate + scale) instead of left/top/width/height keeps this
      // on the compositor — animating layout properties like width/height
      // forces the browser to recompute layout every frame, which is
      // what was causing the stutter.
      var startRect = overlayEl.getBoundingClientRect();
      var targetRect = el.confirmBtn.getBoundingClientRect();

      var dx = (targetRect.left + targetRect.width / 2) - (startRect.left + startRect.width / 2);
      var dy = (targetRect.top + targetRect.height / 2) - (startRect.top + startRect.height / 2) + BUTTON_LANDING_NUDGE_Y;
      var sx = targetRect.width / startRect.width;
      var sy = targetRect.height / startRect.height;

      overlayEl.style.willChange = 'transform';
      overlayEl.style.transition = 'none';
      overlayEl.style.transform = 'translate(0px, 0px) scale(1, 1)';
      void overlayEl.offsetWidth; // flush before animating

      // Wait a frame so the identity transform above actually paints
      // before the transitioned values are applied, otherwise the
      // browser can coalesce both style writes into one frame and skip
      // straight to the end state.
      requestAnimationFrame(function () {
        overlayEl.style.transition =
          'transform ' + MORPH_MS + 'ms cubic-bezier(.4,0,.2,1)';
        /* Translation plus independent X/Y scale only—never rotation. */
        overlayEl.style.transform = 'translate3d(' + dx + 'px, ' + dy + 'px, 0) scale(' + sx + ', ' + sy + ')';
        morphPath(handPath, HAND_BOX_PATH, CIRCLE_PATH, MORPH_MS);
        // Kick off the score-box/title "playing" sizing at the exact
        // same instant the box starts shrinking, using the same
        // MORPH_MS-long transition, so everything settles together
        // instead of the boxes jumping to size right after the box
        // finishes.
        setPlayingLayout(true);
      });

      setTimeout(function () {
        // 3) The main shrink transition has just finished. If the
        // concurrent score-box/title resize shifted the layout at all
        // since we last measured (e.g. a 1px rounding difference from
        // fitTitle's shrink loop), close that residual gap with one more
        // short, smooth correction instead of leaving a hard snap when
        // we swap over to the real button underneath.
        var liveTargetRect = el.confirmBtn.getBoundingClientRect();
        var liveOverlayRect = overlayEl.getBoundingClientRect();
        var driftX = (liveTargetRect.left + liveTargetRect.width / 2) - (liveOverlayRect.left + liveOverlayRect.width / 2);
        var driftY = (liveTargetRect.top + liveTargetRect.height / 2 + BUTTON_LANDING_NUDGE_Y) - (liveOverlayRect.top + liveOverlayRect.height / 2);
        var CORRECTION_MS = 60;
        overlayEl.style.transition = 'transform ' + CORRECTION_MS + 'ms ease-out';
        overlayEl.style.transform = 'translate(' + driftX + 'px, ' + driftY + 'px) ' + overlayEl.style.transform;

        setTimeout(function () {
          // 4) Start the round under the completed circle, then cross-fade
          // between two circles with identical measured geometry.
          onDone();
          overlayEl.style.display = 'flex';
          overlayEl.style.opacity = '1';
          // Keep an opaque button underneath the fading morph circle.
          // Cross-fading both cream layers produced a 25%-transparent
          // midpoint that looked like a brief dark blink.
          el.confirmBtn.style.opacity = '1';
          el.ringSvg.style.opacity = '0';
          void overlayEl.offsetWidth;
          requestAnimationFrame(function () {
            overlayEl.style.transition = 'opacity ' + CROSSFADE_MS + 'ms ease';
            el.ringSvg.style.transition = 'opacity ' + CROSSFADE_MS + 'ms ease';
            overlayEl.style.opacity = '0';
            el.ringSvg.style.opacity = '1';
          });
          setTimeout(function () {
            overlayEl.style.cssText = '';
            overlayEl.style.display = 'none';
            if (handPath) handPath.setAttribute('d', HAND_BOX_PATH);
            children.forEach(function (c) { c.style.cssText = ''; });
            el.confirmBtn.style.cssText = '';
            el.ringSvg.style.cssText = '';
            layoutMorphActive = false;
            flushDeferredViewportWork();
          }, CROSSFADE_MS + 20);
        }, CORRECTION_MS + 20);
      }, MORPH_MS + 40);
    }, FADE_MS + 20);
  }

  // Reverse transition. A fixed outer tracker follows the overlay's live
  // resting position while the page re-centers, and a nested shell handles
  // the circle-to-box scale. This folds the vertical movement into the
  // morph instead of correcting it with a snap afterward.
  function morphButtonIntoOverlay(overlayEl) {
    layoutMorphActive = true;
    var children = Array.prototype.slice.call(overlayEl.children).filter(function (child) {
      return !child.classList.contains('dork-handdrawn-border');
    });
    var startRect = el.confirmBtn.getBoundingClientRect();
    var targetHost = overlayEl.parentElement;
    var targetRect = targetHost.getBoundingClientRect();
    var trueBorderPx = parseFloat(getComputedStyle(overlayEl).borderTopWidth) || 0;
    var dx = (startRect.left + startRect.width / 2) - (targetRect.left + targetRect.width / 2);
    var dy = (startRect.top + startRect.height / 2) - (targetRect.top + targetRect.height / 2);
    var sx = startRect.width / targetRect.width;
    var sy = startRect.height / targetRect.height;

    var tracker = document.createElement('div');
    var shell = document.createElement('div');
    tracker.className = 'dork-morph-tracker';
    shell.className = 'dork-morph-shell handdrawn-shell';
    tracker.style.width = targetRect.width + 'px';
    tracker.style.height = targetRect.height + 'px';
    tracker.style.transform = 'translate3d(' + targetRect.left + 'px, ' + targetRect.top + 'px, 0)';
    shell.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(' + sx + ', ' + sy + ')';
    shell.style.borderLeftWidth = (trueBorderPx / sx) + 'px';
    shell.style.borderRightWidth = (trueBorderPx / sx) + 'px';
    shell.style.borderTopWidth = (trueBorderPx / sy) + 'px';
    shell.style.borderBottomWidth = (trueBorderPx / sy) + 'px';
    var shellBorder = overlayEl.querySelector('.dork-handdrawn-border').cloneNode(true);
    var shellPath = shellBorder.querySelector('path');
    shellPath.setAttribute('d', GAME_CIRCLE_PATH);
    shell.appendChild(shellBorder);
    tracker.appendChild(shell);
    document.body.appendChild(tracker);

    el.confirmBtn.classList.remove('idle-bounce', 'pressed', 'success');
    el.confirmWrap.classList.remove('pulsing');
    el.confirmBtn.style.animation = 'none';
    el.confirmBtn.style.transition = 'none';
    el.ringSvg.style.transition = 'none';
    children.forEach(function (c) {
      c.style.transition = 'none';
      c.style.opacity = '0';
    });
    void shell.offsetWidth;

    // The shell now exactly covers the button, so the real gameplay
    // elements can disappear without a visual positional handoff.
    el.confirmBtn.style.opacity = '0';
    el.ringSvg.style.opacity = '0';

    var tracking = true;
    var trackingRaf = null;
    function followRestingBox() {
      var liveRect = targetHost.getBoundingClientRect();
      tracker.style.transform = 'translate3d(' + liveRect.left + 'px, ' + liveRect.top + 'px, 0)';
      if (tracking) trackingRaf = requestAnimationFrame(followRestingBox);
    }
    trackingRaf = requestAnimationFrame(followRestingBox);

    requestAnimationFrame(function () {
      // The score boxes/title resize over the same 380ms. followRestingBox
      // turns that re-centering into a smooth slide of the expanding shell.
      setPlayingLayout(false);
      shell.style.transition =
        'transform ' + MORPH_MS + 'ms cubic-bezier(.4,0,.2,1)';
      shell.style.transform = 'translate(0px, 0px) scale(1, 1)';
      morphPath(shellPath, GAME_CIRCLE_PATH, HAND_BOX_PATH, MORPH_MS);

      setTimeout(function () {
        // Only now—after the full morph—fade the real box in over the
        // still-opaque shell. Keeping the lower layer at 100% coverage
        // prevents the background from darkening during the handoff.
        overlayEl.style.cssText = '';
        overlayEl.style.display = 'flex';
        overlayEl.style.pointerEvents = 'none';
        overlayEl.style.opacity = '0';
        overlayEl.style.transition = 'none';
        void overlayEl.offsetWidth;

        requestAnimationFrame(function () {
          overlayEl.style.transition = 'opacity ' + CROSSFADE_MS + 'ms ease';
          overlayEl.style.opacity = '1';
        });

        setTimeout(function () {
          tracking = false;
          if (trackingRaf) cancelAnimationFrame(trackingRaf);
          tracker.remove();

          state.morphingOut = false;
          layoutMorphActive = false;
          el.confirmBtn.style.cssText = '';
          el.ringSvg.style.cssText = '';
          clearTimerRing();
          render();
          flushDeferredViewportWork();

          children.forEach(function (c) {
            c.style.transition = 'opacity ' + FADE_MS + 'ms ease';
            c.style.opacity = '1';
          });
          setTimeout(function () {
            overlayEl.style.pointerEvents = '';
            overlayEl.style.transition = '';
            overlayEl.style.opacity = '';
            children.forEach(function (c) { c.style.cssText = ''; });
          }, FADE_MS + 20);
        }, CROSSFADE_MS + 20);
      }, MORPH_MS + 30);
    });
  }

  // ---------- controls ----------
  document.addEventListener('pointerdown', glowBackgroundIcon, { passive: true });

  var titleBlushTimeoutId = null;
  function clearTitleBlush() {
    if (titleBlushTimeoutId !== null) {
      clearTimeout(titleBlushTimeoutId);
      titleBlushTimeoutId = null;
    }
    el.dorkTitleHead.classList.remove('blushing');
  }

  function showTitleBlush() {
    clearTitleBlush();
    // Force the pseudo-element animation back to its first frame so every
    // menu tap—including rapid repeats—gets the complete blush response.
    void el.dorkTitleHead.offsetWidth;
    el.dorkTitleHead.classList.add('blushing');
    titleBlushTimeoutId = setTimeout(function () {
      el.dorkTitleHead.classList.remove('blushing');
      titleBlushTimeoutId = null;
    }, 2520);
  }

  el.dorkTitleHead.addEventListener('click', function (e) {
    if (state.gameState === 'playing' || state.morphingOut || layoutMorphActive) return;
    e.preventDefault();
    e.stopPropagation();
    showTitleBlush();
  });

  function fadeToRandomSubtitle(onSubtitleSwapped, allowDuringMorph) {
    if (state.gameState === 'playing' || state.morphingOut ||
        (layoutMorphActive && allowDuringMorph !== true)) return false;
    if (typeof onSubtitleSwapped === 'function' && subtitleSwapCallbacks.indexOf(onSubtitleSwapped) === -1) {
      subtitleSwapCallbacks.push(onSubtitleSwapped);
    }
    // If a menu tap already started the fade, GO AGAIN can join that same
    // transition instead of interrupting it or making the button feel dead.
    if (subtitleChanging) return true;
    subtitleChanging = true;
    var swapHandled = false;

    function finishSwap() {
      if (swapHandled) return;
      swapHandled = true;
      chooseRandomSubtitle(true);
      fitTitle(true, allowDuringMorph === true);
      var callbacks = subtitleSwapCallbacks.slice();
      subtitleSwapCallbacks.length = 0;
      callbacks.forEach(function (callback) { callback(); });
    }

    var fadeOut = el.dorkSubtitle.animate([
      { opacity: 1 },
      { opacity: 0 }
    ], { duration: 180, easing: 'ease-in', fill: 'forwards' });

    fadeOut.finished.then(function () {
      finishSwap();
      fadeOut.cancel();
      var fadeIn = el.dorkSubtitle.animate([
        { opacity: 0 },
        { opacity: 1 }
      ], { duration: 240, easing: 'ease-out', fill: 'forwards' });
      fadeIn.finished.then(function () {
        fadeIn.cancel();
        el.dorkSubtitle.style.opacity = '1';
        subtitleChanging = false;
      }).catch(function () {
        el.dorkSubtitle.style.opacity = '1';
        subtitleChanging = false;
      });
    }).catch(function () {
      finishSwap();
      el.dorkSubtitle.style.opacity = '1';
      subtitleChanging = false;
    });
    return true;
  }

  el.dorkSubtitle.addEventListener('click', function (e) {
    e.preventDefault();
    e.stopPropagation();
    fadeToRandomSubtitle();
  });

  var highScoreTapTimes = [];
  var HIGH_SCORE_RESET_WINDOW_MS = 900;
  el.highScoreBox.addEventListener('click', function (e) {
    // Never treat gameplay taps—or taps during either geometry morph—as
    // reset gestures. The reset is intentionally available only at rest.
    if (state.gameState === 'playing' || state.morphingOut || layoutMorphActive) return;
    e.preventDefault();
    e.stopPropagation();
    var now = performance.now();
    highScoreTapTimes = highScoreTapTimes.filter(function (tapTime) {
      return now - tapTime <= HIGH_SCORE_RESET_WINDOW_MS;
    });
    highScoreTapTimes.push(now);
    if (highScoreTapTimes.length < 3) return;

    highScoreTapTimes = [];
    state.highScore = 0;
    state.beatHighScore = false;
    try { localStorage.removeItem('dorkit-highscore'); } catch (storageError) {}
    el.highScoreReadout.textContent = '00';
    if (state.gameState === 'gameover') el.gameoverSub.textContent = 'HIGH SCORE: 0';
  });

  el.startBtn.addEventListener('click', function (e) {
    e.preventDefault();
    unlockAudio();
    morphOverlayIntoButton(el.idleOverlay, startGame);
  });

  function beginPlayAgainMorph() {
    if (layoutMorphActive || state.morphingOut || state.gameState === 'playing') return false;
    morphOverlayIntoButton(el.gameoverOverlay, startGame);
    return true;
  }

  el.playAgainBtn.addEventListener('click', function (e) {
    e.preventDefault();
    unlockAudio();
    if (!beginPlayAgainMorph()) return;
    // Begin the fade shortly after the replay morph starts. Its 180ms
    // fade-out puts the actual text swap about 300ms into the transition,
    // near the middle rather than at the initial press.
    setTimeout(function () {
      fadeToRandomSubtitle(null, true);
    }, 120);
  });
  // Tap/click ANYWHERE on the screen completes the action — not just the
  // circle — so it's easy to keep up during fast, frantic play.
  var lastTapTime = 0;
  document.addEventListener('touchstart', function (e) {
    if (state.gameState !== 'playing') return;
    e.preventDefault();
    lastTapTime = Date.now();
    var touch = e.touches[0] || e.changedTouches[0];
    handleConfirm(touch ? { clientX: touch.clientX, clientY: touch.clientY } : null);
  }, { passive: false });
  document.addEventListener('click', function (e) {
    if (state.gameState !== 'playing') return;
    if (Date.now() - lastTapTime < 500) {
      e.preventDefault();
      return;
    }
    handleConfirm({ clientX: e.clientX, clientY: e.clientY });
  }, true);

  // Fully block scroll/drag gestures everywhere on the page (not just
  // touchstart) so Safari's chrome never has a reason to collapse or
  // expand mid-swipe — that resize is what exposes white space.
  // Defensive scroll reset for iOS Safari — in case any gesture slips
  // through, snap the page back to (0,0) immediately so nothing can
  // drift and expose space beyond the oversized background fill.
  function resetScroll() {
    if (state.timerRunning) {
      scrollResetPending = true;
      return;
    }
    // Preserve the iOS white-bar safety net without forcing a no-op scroll
    // and synchronous viewport update on every Safari resize event.
    if (window.scrollX !== 0 || window.scrollY !== 0) window.scrollTo(0, 0);
  }
  window.addEventListener('load', function () {
    resetScroll();
    updateLogoRowMasks();
  });
  window.addEventListener('orientationchange', function () {
    setTimeout(function () {
      resetScroll();
      updateLogoRowMasks();
    }, 50);
  });
  window.addEventListener('resize', resetScroll);
  document.addEventListener('scroll', resetScroll, { passive: true });

  document.addEventListener('touchmove', function (e) {
    e.preventDefault();
  }, { passive: false });

  window.addEventListener('keydown', function (e) {
    if (state.gameState !== 'playing') return;
    if (e.key === ' ' || e.key === 'Spacebar' || e.key === 'Enter') {
      e.preventDefault();
      handleConfirm();
    }
  });

  if (state.highScore === 0) {
    el.dorkSubtitle.textContent = SUBTITLE_OPTIONS[0];
    el.dorkSubtitle.setAttribute('aria-label', SUBTITLE_OPTIONS[0]);
  } else {
    chooseRandomSubtitle(false);
  }
  render();
  fitTitle();
  updateLogoRowMasks();
})();
</script>
</body>
</html>
