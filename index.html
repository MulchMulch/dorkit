<!DOCTYPE html>
<html lang="en">
<head>

<title>Dork It</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    height: 100dvh;
    width: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    background: #8FD3F4;
    font-family: 'Baloo 2', sans-serif;
    color: #3B230F;
    /* Matches the thickness of the black outline drawn around the
       "DORK IT" title (that outline is built from text-shadow rings out
       to 0.065em of the title's clamp(44px, 15vw, 92px) font-size —
       i.e. 0.065 * 44px to 0.065 * 92px, scaling with 0.065 * 15vw in
       between). Used as the border-width for every black-bordered box
       and button so they all read as the same stroke weight. */
    --dork-border-w: clamp(3px, 1vw, 6px);
    /* Score cards use a deliberately lighter outline: exactly 75% of
       the shared border scale, without changing any other game border. */
    --dork-score-border-w: clamp(2.25px, 0.75vw, 4.5px);
  }
  /* Oversized fixed background element — deliberately bigger than the
     viewport in every direction and pinned with position:fixed so that
     iOS Safari's address bar/toolbar collapsing or expanding during a
     swipe attempt can never reveal white space behind the page. This is
     a real DOM element (not a pseudo-element) placed first in <body>
     so it can't be affected by any ancestor positioning quirks. */
  #bgFill {
    position: fixed;
    top: -25vh; left: -25vw;
    width: 150vw; height: 150vh;
    background: #8FD3F4;
    pointer-events: none;
  }
  /* Same oversized/fixed trick as #bgFill, painted on top of it (later in
     DOM order, same default stacking level) so the tiled icon pattern
     sits above the gradient but still stays fully behind the app
     content. IMPORTANT: no negative z-index here — a position:fixed
     element with z-index < 0 renders BEHIND the root canvas background
     painted by html/body's own "background", making it invisible no
     matter what it contains. Leaving z-index at its default (auto) and
     relying on DOM order keeps these layers correctly stacked: behind
     .dork-app, but on top of the page's canvas background. */
  #logoTile {
    position: fixed;
    top: -25vh; left: -25vw;
    width: 150vw; height: 150vh;
    pointer-events: none;
  }
  #logoTile svg { display: block; width: 100%; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  /* position:relative (no offset, so no layout change) is required here:
     #bgFill/#logoTile are position:fixed. Per CSS stacking rules, ANY
     positioned element (even with z-index:auto) paints above static
     in-flow content in the same stacking context, regardless of DOM
     order. Without this, .dork-app (static) would render BEHIND the
     fixed background layers no matter what order they're written in,
     hiding the whole app. Making .dork-app positioned too puts it in
     the same z-index:auto stacking bucket as the background layers,
     where DOM order (declared after them) correctly wins. */
  .dork-app { position: relative; width: 100%; max-width: 640px; min-width: 0; user-select: none; -webkit-user-select: none; }

  .dork-header { display: flex; align-items: center; justify-content: center; margin-bottom: 18px; width: 100%; min-width: 0; overflow: hidden; }
  .dork-title {
    font-family: 'Fredoka One', 'Baloo 2', sans-serif; font-weight: 400; font-size: clamp(44px, 15vw, 92px);
    color: #FFF8ED;
    /* Thick outline built from two concentric rings of small text-shadow
       offsets (in em, so it scales with font-size) rather than
       -webkit-text-stroke — a real stroke self-intersects and breaks on
       glyphs like "R" in this font. The 8-point version left a visibly
       faceted/jagged ring around curves (O, D); using many more points
       per ring (16 inner, 28 outer) makes each ring dense enough to
       read as a smooth curve instead of a polygon. The drop shadow
       repeats that entire ring set again, shifted straight down, so the
       shadow has the stroke's outline baked into its silhouette instead
       of just being a plain copy of the thinner fill glyph underneath. */

            0.0320em 0.0000em 0 #000,
      0.0296em 0.0122em 0 #000,
      0.0226em 0.0226em 0 #000,
      0.0122em 0.0296em 0 #000,

      -0.0634em 0.0145em 0 #000,
      -0.0650em 0.0000em 0 #000,
      -0.0634em -0.0145em 0 #000,

      0.0145em -0.0634em 0 #000,

      0.0405em -0.0508em 0 #000,
      0.0508em -0.0405em 0 #000,
      0.0586em -0.0282em 0 #000,

      0.0586em 0.1132em 0 #000,
      0.0508em 0.1255em 0 #000,
      0.0405em 0.1358em 0 #000,
      0.0282em 0.1436em 0 #000,
      0.0145em 0.1484em 0 #000,
      0.0000em 0.1500em 0 #000,
      -0.0145em 0.1484em 0 #000,
      -0.0282em 0.1436em 0 #000,

      -0.0508em 0.1255em 0 #000,

      0.0000em 0.0850em 0 #000;;
    display: flex; align-items: center; gap: 10px;
    white-space: nowrap; max-width: 100%;
    transition: font-size 380ms cubic-bezier(.4,0,.2,1);
  }
  .dork-wiggle {
    display: inline-block;
    position: relative;
    top: 0.07em;
    text-shadow: none;
    animation: wiggle 1.6s ease-in-out infinite;
  }
  .dork-subbar { position: relative; display: flex; align-items: center; justify-content: center; gap: 28px; margin-top: 18px; }
  .dork-readout {
    font-family: 'Fredoka', sans-serif; font-weight: 700;
    background: #FFF8ED; border: var(--dork-score-border-w) solid #3B230F; box-shadow: 3px 3px 0 rgba(59,35,15,0.3);
    padding: 6px 12px; border-radius: 16px; font-size: clamp(14px, 3.2vw, 18px);
    transition: padding 380ms cubic-bezier(.4,0,.2,1), font-size 380ms cubic-bezier(.4,0,.2,1), box-shadow 380ms cubic-bezier(.4,0,.2,1);
  }
  .dork-readout b { color: #FF5FA2; }
  .dork-readout.big {
    /* Keep the boxes at the same visual size as before, but grow them
       through their actual dimensions instead of transform scaling. This
       keeps the flex gap visually identical in idle and playing states. */
    padding: 13px 24px; border-radius: 22px; font-size: clamp(22px, 5.4vw, 32px);
    transform: none; box-shadow: 5px 5px 0 rgba(59,35,15,0.3);
  }
  .dork-readout.pulse-score {
    animation: scorePulse 0.32s ease-in-out;
    transform-origin: center center;
    will-change: transform;
  }

  .dork-relative {
    position: relative;
    min-height: clamp(308px, 94.6vmin, 770px);
    display: flex; align-items: center; justify-content: center;
  }
  .dork-pod {
    position: relative;
    width: 100%;
    max-width: clamp(260px, 90vmin, 700px);
    display: flex; flex-direction: column; align-items: center;
  }
  .dork-pod.wobble { animation: wobbleFail 0.5s ease; }

  .dork-confirm-wrap {
    position: relative;
    width: clamp(240px, 82vmin, 640px);
    height: clamp(240px, 82vmin, 640px);
    display: flex; align-items: center; justify-content: center;
    transform-origin: center;
    transform: translateY(-8px);
  }
  .dork-confirm-wrap.pulsing { animation: none; }
  .dork-ring {
    /* Give only the canvas layer 4% of extra room on every side. The
       button, wrapper, timer core, and all layout geometry stay unchanged. */
    position: absolute; inset: -4%; width: auto; height: auto;
    pointer-events: none; z-index: 1;
    transition: transform 90ms ease;
    contain: strict;
  }
  .dork-ring.pressed { transform: none; }
  .dork-ring-fg {
    display: block; width: 100%; height: 100%;
  }

  /* The reverse morph uses a viewport-fixed tracker plus a nested shell.
     The tracker follows the box's live resting position while the page
     re-centers; the shell independently grows from circle to box. */
  .dork-morph-tracker {
    position: fixed; left: 0; top: 0; z-index: 60;
    pointer-events: none; will-change: transform, opacity;
  }
  .dork-morph-shell {
    position: absolute; inset: 0; box-sizing: border-box;
    border: var(--dork-border-w) solid #3B230F;
    border-radius: 50%; background: #FFF8ED;
    transform-origin: center center;
    will-change: transform, border-radius;
  }

  .dork-confirm {
    position: relative;
    z-index: 2;
    width: 88%;
    height: 88%;
    border-radius: 9999px;
    background: #FFF8ED;
    border-style: solid;
    border-width: var(--dork-border-w);
    border-color: #3B230F;
    color: #3B230F;
    font-family: 'Fredoka', sans-serif; font-weight: 700;
    font-size: clamp(22px, 6vmin, 44px);
    letter-spacing: 0.5px;
    line-height: 1.25;
    padding: 0 6%;
    cursor: default;
    transition: transform 90ms ease, border-color 150ms ease, box-shadow 150ms ease;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  .dork-confirm.playing { cursor: pointer; }
  .dork-confirm.idle-bounce { animation: bounceIdle 1.8s ease-in-out infinite; }
  .dork-confirm.pressed { transform: none; }
  .dork-confirm.success { animation: coverRing 0.38s cubic-bezier(.2,.8,.2,1); }
  .dork-confirm.long-label { font-size: clamp(20px, 5.4vmin, 40px); overflow-wrap: anywhere; word-break: normal; }
  .dork-confirm.combo {
    box-shadow: 0 0 16px 7px rgba(255,215,0,0.52);
    animation: none;
  }
  .dork-confirm.combo.success { animation: coverRing 0.38s cubic-bezier(.2,.8,.2,1); }

  .confetti-piece {
    position: absolute; left: 50%; top: 50%; z-index: 40;
    margin-left: -0.5em; margin-top: -0.5em;
    font-size: clamp(48px, 9vmin, 84px); pointer-events: none;
    will-change: transform, opacity;
  }
  .combo-milestone {
    position: absolute; left: 50%; bottom: calc(100% + 29px); z-index: 50;
    pointer-events: none; white-space: nowrap;
    font-family: 'Fredoka', sans-serif; font-weight: 700;
    font-size: clamp(24px, 7vmin, 48px); color: #FFD93D;
    -webkit-text-stroke: clamp(1.5px, 0.45vmin, 3px) #3B230F;
    paint-order: stroke fill;
    text-shadow: 0 4px 0 rgba(59,35,15,0.24);
    transform-origin: center center;
    will-change: transform, opacity;
    animation: comboMilestonePop 0.95s cubic-bezier(.2,.8,.2,1) forwards;
  }

  .dork-overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 0 8%; border-radius: 24px; background: #FFF8ED;
    border-style: solid; border-width: var(--dork-border-w); border-color: #3B230F;
    z-index: 20;
  }
  .dork-overlay-title {
    font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: clamp(32px, 7vw, 44px); color: #FF5FA2;
    margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
  }
  .dork-overlay p {
    color: #7A5A38; font-family: 'Baloo 2', sans-serif; font-weight: 600;
    font-size: clamp(21.12px, 5.016vw, 27.72px); max-width: 420px; margin: 0 0 20px; line-height: 1.5;
  }
  .dork-btn {
    font-family: 'Fredoka', sans-serif; font-weight: 700; background: #4ADE9C; color: #1F3B2C;
    border: var(--dork-border-w) solid #3B230F; box-shadow: 5px 5px 0 rgba(59,35,15,0.35);
    padding: 14px 34px; border-radius: 999px; font-size: clamp(16px, 3.8vw, 21px); cursor: pointer; margin-bottom: 16px;
  }
  .dork-highscore { font-family: 'Fredoka', sans-serif; font-weight: 700; color: #7A5A38; font-size: clamp(14px, 3.2vw, 18px); margin-top: 8px; }

  .dork-gameover-title {
    font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: clamp(30px, 7vw, 42px); color: #FF5C5C; margin-bottom: 8px;
  }
  .dork-gameover-score { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: clamp(34px, 8vw, 48px); color: #3B230F; margin-bottom: 4px; }
  .dork-gameover-sub { font-family: 'Baloo 2', sans-serif; font-weight: 600; color: #7A5A38; font-size: clamp(14px, 3.2vw, 18px); margin-bottom: 24px; }

  @keyframes wiggle {
    0%, 100% { transform: rotate(-6deg); }
    50% { transform: rotate(6deg); }
  }
  @keyframes bounceIdle {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-6px) scale(1.02); }
  }
  @keyframes slowPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.025); }
  }
  @keyframes coverRing {
    0% { transform: scale(1); }
    42%, 56% { transform: scale(1.22); }
    100% { transform: scale(1); }
  }
  @keyframes wobbleFail {
    0%, 100% { transform: rotate(0deg) translateX(0); }
    20% { transform: rotate(-8deg) translateX(-6px); }
    40% { transform: rotate(7deg) translateX(6px); }
    60% { transform: rotate(-5deg) translateX(-4px); }
    80% { transform: rotate(4deg) translateX(4px); }
  }
  @keyframes confettiPop {
    0% { transform: translate(0,0) rotate(0deg) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; }
  }
  @keyframes comboMilestonePop {
    0%   { transform: translate(-50%, 18px) scale(0.65) rotate(-5deg); opacity: 0; }
    22%  { transform: translate(-50%, 0) scale(1.14) rotate(2deg); opacity: 1; }
    62%  { transform: translate(-50%, -5px) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translate(-50%, -38px) scale(0.96) rotate(0deg); opacity: 0; }
  }
  @keyframes scorePulse {
    0%   { transform: scale(1); }
    45%  { transform: scale(1.13); }
    100% { transform: scale(1); }
  }
</style>

  // including its border — so a box with a normal 6px border shrinks to
  // a ~4px-looking border partway through the morph, then pops back to
  // a full 6px the instant the real (non-scaled) button/box underneath
  // is revealed. That pop is what read as jitter around the edges.
  // This keeps the *visual* border thickness constant throughout the
  // transform by continuously reading the live, currently-interpolating
  // scale straight off the computed transform matrix (so it automatically
  // tracks the CSS transition's actual easing, frame for frame) and
  // setting an inversely-scaled border-width to compensate.
  function keepBorderVisuallyConstant(targetEl, durationMs, knownBorderPx) {
    var trueBorderPx = knownBorderPx || parseFloat(getComputedStyle(targetEl).borderTopWidth) || 0;
    var start = performance.now();
    function frame() {
      var elapsed = performance.now() - start;
      var m = new DOMMatrix(getComputedStyle(targetEl).transform);
      var scaleX = Math.hypot(m.a, m.b) || 1;
      var scaleY = Math.hypot(m.c, m.d) || 1;
      targetEl.style.borderLeftWidth = (trueBorderPx / scaleX) + 'px';
      targetEl.style.borderRightWidth = (trueBorderPx / scaleX) + 'px';
      targetEl.style.borderTopWidth = (trueBorderPx / scaleY) + 'px';
      targetEl.style.borderBottomWidth = (trueBorderPx / scaleY) + 'px';
      if (elapsed < durationMs + 20) {
        requestAnimationFrame(frame);
      } else {
        targetEl.style.borderWidth = trueBorderPx + 'px';
        targetEl.style.borderLeftWidth = '';
        targetEl.style.borderRightWidth = '';
        targetEl.style.borderTopWidth = '';
        targetEl.style.borderBottomWidth = '';
      }
    }
    requestAnimationFrame(frame);
  }

  function morphOverlayIntoButton(overlayEl, onDone) {
    var children = Array.prototype.slice.call(overlayEl.children);
    overlayEl.style.pointerEvents = 'none';

    // Keep the real button perfectly still and hidden until the final
    // same-geometry cross-fade. This prevents an idle-bounce frame from
    // changing the target between measurement and handoff.
    el.confirmBtn.classList.remove('idle-bounce', 'pressed');
    el.confirmWrap.classList.remove('pulsing');
    el.confirmBtn.style.animation = 'none';
    el.confirmBtn.style.transition = 'none';
    el.ringSvg.style.transition = 'none';
    el.confirmBtn.style.opacity = '0';
    el.ringSvg.style.opacity = '0';

    // Keep the ring empty during the geometry morph. Once the new round
    // starts, showWaitingRing() fades in a full green ring immediately,
    // while its countdown remains paused for the spoken command.
    clearTimerRing();

    // 1) Quickly fade out all the overlay's content.
    children.forEach(function (c) {
      c.style.transition = 'opacity ' + FADE_MS + 'ms ease';
      c.style.opacity = '0';
    });

    setTimeout(function () {
      // 2) Morph the (now-empty) box from its current rect into the
      // confirm button's circle, using its actual on-screen position so
      // this works regardless of viewport size. Animating `transform`
      // (translate + scale) instead of left/top/width/height keeps this
      // on the compositor — animating layout properties like width/height
      // forces the browser to recompute layout every frame, which is
      // what was causing the stutter.
      var startRect = overlayEl.getBoundingClientRect();
      var targetRect = el.confirmBtn.getBoundingClientRect();

      var dx = (targetRect.left + targetRect.width / 2) - (startRect.left + startRect.width / 2);
      var dy = (targetRect.top + targetRect.height / 2) - (startRect.top + startRect.height / 2) + BUTTON_LANDING_NUDGE_Y;
      var sx = targetRect.width / startRect.width;
      var sy = targetRect.height / startRect.height;

      overlayEl.style.willChange = 'transform, border-radius';
      overlayEl.style.transition = 'none';
      overlayEl.style.transform = 'translate(0px, 0px) scale(1, 1)';
      void overlayEl.offsetWidth; // flush before animating

      // Wait a frame so the identity transform above actually paints
      // before the transitioned values are applied, otherwise the
      // browser can coalesce both style writes into one frame and skip
      // straight to the end state.
      requestAnimationFrame(function () {
        overlayEl.style.transition =
          'transform ' + MORPH_MS + 'ms cubic-bezier(.4,0,.2,1), ' +
          'border-radius ' + MORPH_MS + 'ms cubic-bezier(.4,0,.2,1)';
        overlayEl.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(' + sx + ', ' + sy + ')';
        overlayEl.style.borderRadius = '50%';
        keepBorderVisuallyConstant(overlayEl, MORPH_MS);
        // Kick off the score-box/title "playing" sizing at the exact
        // same instant the box starts shrinking, using the same
        // MORPH_MS-long transition, so everything settles together
        // instead of the boxes jumping to size right after the box
        // finishes.
        setPlayingLayout(true);
      });

      setTimeout(function () {
        // 3) The main shrink transition has just finished. If the
        // concurrent score-box/title resize shifted the layout at all
        // since we last measured (e.g. a 1px rounding difference from
        // fitTitle's shrink loop), close that residual gap with one more
        // short, smooth correction instead of leaving a hard snap when
        // we swap over to the real button underneath.
        var liveTargetRect = el.confirmBtn.getBoundingClientRect();
        var liveOverlayRect = overlayEl.getBoundingClientRect();
        var driftX = (liveTargetRect.left + liveTargetRect.width / 2) - (liveOverlayRect.left + liveOverlayRect.width / 2);
        var driftY = (liveTargetRect.top + liveTargetRect.height / 2 + BUTTON_LANDING_NUDGE_Y) - (liveOverlayRect.top + liveOverlayRect.height / 2);
        var CORRECTION_MS = 60;
        overlayEl.style.transition = 'transform ' + CORRECTION_MS + 'ms ease-out';
        overlayEl.style.transform = 'translate(' + driftX + 'px, ' + driftY + 'px) ' + overlayEl.style.transform;

        setTimeout(function () {
          // 4) Start the round under the completed circle, then cross-fade
          // between two circles with identical measured geometry.
          onDone();
          overlayEl.style.display = 'flex';
          overlayEl.style.opacity = '1';
          // Keep an opaque button underneath the fading morph circle.
          // Cross-fading both cream layers produced a 25%-transparent
          // midpoint that looked like a brief dark blink.
          el.confirmBtn.style.opacity = '1';
          el.ringSvg.style.opacity = '0';
          void overlayEl.offsetWidth;
          requestAnimationFrame(function () {
            overlayEl.style.transition = 'opacity ' + CROSSFADE_MS + 'ms ease';
            el.ringSvg.style.transition = 'opacity ' + CROSSFADE_MS + 'ms ease';
            overlayEl.style.opacity = '0';
            el.ringSvg.style.opacity = '1';
          });
          setTimeout(function () {
            overlayEl.style.cssText = '';
            overlayEl.style.display = 'none';
            children.forEach(function (c) { c.style.cssText = ''; });
            el.confirmBtn.style.cssText = '';
            el.ringSvg.style.cssText = '';
          }, CROSSFADE_MS + 20);
        }, CORRECTION_MS + 20);
      }, MORPH_MS + 40);
    }, FADE_MS + 20);
  }

  // Reverse transition. A fixed outer tracker follows the overlay's live
  // resting position while the page re-centers, and a nested shell handles
  // the circle-to-box scale. This folds the vertical movement into the
  // morph instead of correcting it with a snap afterward.
  function morphButtonIntoOverlay(overlayEl) {
    var children = Array.prototype.slice.call(overlayEl.children);
    var startRect = el.confirmBtn.getBoundingClientRect();
    var targetHost = overlayEl.parentElement;
    var targetRect = targetHost.getBoundingClientRect();
    var trueBorderPx = parseFloat(getComputedStyle(overlayEl).borderTopWidth) || 0;
    var dx = (startRect.left + startRect.width / 2) - (targetRect.left + targetRect.width / 2);
    var dy = (startRect.top + startRect.height / 2) - (targetRect.top + targetRect.height / 2);
    var sx = startRect.width / targetRect.width;
    var sy = startRect.height / targetRect.height;

    var tracker = document.createElement('div');
    var shell = document.createElement('div');
    tracker.className = 'dork-morph-tracker';
    shell.className = 'dork-morph-shell';
    tracker.style.width = targetRect.width + 'px';
    tracker.style.height = targetRect.height + 'px';
    tracker.style.transform = 'translate3d(' + targetRect.left + 'px, ' + targetRect.top + 'px, 0)';
    shell.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(' + sx + ', ' + sy + ')';
    shell.style.borderLeftWidth = (trueBorderPx / sx) + 'px';
    shell.style.borderRightWidth = (trueBorderPx / sx) + 'px';
    shell.style.borderTopWidth = (trueBorderPx / sy) + 'px';
    shell.style.borderBottomWidth = (trueBorderPx / sy) + 'px';
    tracker.appendChild(shell);
    document.body.appendChild(tracker);

    el.confirmBtn.classList.remove('idle-bounce', 'pressed', 'success');
    el.confirmWrap.classList.remove('pulsing');
    el.confirmBtn.style.animation = 'none';
    el.confirmBtn.style.transition = 'none';
    el.ringSvg.style.transition = 'none';
    children.forEach(function (c) {
      c.style.transition = 'none';
      c.style.opacity = '0';
    });
    void shell.offsetWidth;

    // The shell now exactly covers the button, so the real gameplay
    // elements can disappear without a visual positional handoff.
    el.confirmBtn.style.opacity = '0';
    el.ringSvg.style.opacity = '0';

    var tracking = true;
    var trackingRaf = null;
    function followRestingBox() {
      var liveRect = targetHost.getBoundingClientRect();
      tracker.style.transform = 'translate3d(' + liveRect.left + 'px, ' + liveRect.top + 'px, 0)';
      if (tracking) trackingRaf = requestAnimationFrame(followRestingBox);
    }
    trackingRaf = requestAnimationFrame(followRestingBox);

    requestAnimationFrame(function () {
      // The score boxes/title resize over the same 380ms. followRestingBox
      // turns that re-centering into a smooth slide of the expanding shell.
      setPlayingLayout(false);
      shell.style.transition =
        'transform ' + MORPH_MS + 'ms cubic-bezier(.4,0,.2,1), ' +
        'border-radius ' + MORPH_MS + 'ms cubic-bezier(.4,0,.2,1)';
      shell.style.transform = 'translate(0px, 0px) scale(1, 1)';
      shell.style.borderRadius = '24px';
      keepBorderVisuallyConstant(shell, MORPH_MS, trueBorderPx);

      setTimeout(function () {
        // Only now—after the full morph—fade the real box in over the
        // still-opaque shell. Keeping the lower layer at 100% coverage
        // prevents the background from darkening during the handoff.
        overlayEl.style.cssText = '';
        overlayEl.style.display = 'flex';
        overlayEl.style.pointerEvents = 'none';
        overlayEl.style.opacity = '0';
        overlayEl.style.transition = 'none';
        void overlayEl.offsetWidth;

        requestAnimationFrame(function () {
          overlayEl.style.transition = 'opacity ' + CROSSFADE_MS + 'ms ease';
          overlayEl.style.opacity = '1';
        });

        setTimeout(function () {
          tracking = false;
          if (trackingRaf) cancelAnimationFrame(trackingRaf);
          tracker.remove();

          state.morphingOut = false;
          el.confirmBtn.style.cssText = '';
          el.ringSvg.style.cssText = '';
          clearTimerRing();
          render();

          children.forEach(function (c) {
            c.style.transition = 'opacity ' + FADE_MS + 'ms ease';
            c.style.opacity = '1';
          });
          setTimeout(function () {
            overlayEl.style.pointerEvents = '';
            overlayEl.style.transition = '';
            overlayEl.style.opacity = '';
            children.forEach(function (c) { c.style.cssText = ''; });
          }, FADE_MS + 20);
        }, CROSSFADE_MS + 20);
      }, MORPH_MS + 30);
    });
  }

  // ---------- controls ----------
  el.startBtn.addEventListener('click', function (e) {
    e.preventDefault();
    unlockAudio();
    morphOverlayIntoButton(el.idleOverlay, startGame);
  });
  el.playAgainBtn.addEventListener('click', function (e) {
    e.preventDefault();
    unlockAudio();
    morphOverlayIntoButton(el.gameoverOverlay, startGame);
  });
  // Tap/click ANYWHERE on the screen completes the action — not just the
  // circle — so it's easy to keep up during fast, frantic play.
  var lastTapTime = 0;
  document.addEventListener('touchstart', function (e) {
    if (state.gameState !== 'playing') return;
    e.preventDefault();
    lastTapTime = Date.now();
    var touch = e.touches[0] || e.changedTouches[0];
    handleConfirm(touch ? { clientX: touch.clientX, clientY: touch.clientY } : null);
  }, { passive: false });
  document.addEventListener('click', function (e) {
    if (state.gameState !== 'playing') return;
    if (Date.now() - lastTapTime < 500) {
      e.preventDefault();
      return;
    }
    handleConfirm({ clientX: e.clientX, clientY: e.clientY });
  }, true);

  // Fully block scroll/drag gestures everywhere on the page (not just
  // touchstart) so Safari's chrome never has a reason to collapse or
  // expand mid-swipe — that resize is what exposes white space.
  // Defensive scroll reset for iOS Safari — in case any gesture slips
  // through, snap the page back to (0,0) immediately so nothing can
  // drift and expose space beyond the oversized background fill.
  function resetScroll() { window.scrollTo(0, 0); }
  window.addEventListener('load', resetScroll);
  window.addEventListener('orientationchange', function () { setTimeout(resetScroll, 50); });
  window.addEventListener('resize', resetScroll);
  document.addEventListener('scroll', resetScroll, { passive: true });

  document.addEventListener('touchmove', function (e) {
    e.preventDefault();
  }, { passive: false });

  window.addEventListener('keydown', function (e) {
    if (state.gameState !== 'playing') return;
    if (e.key === ' ' || e.key === 'Spacebar' || e.key === 'Enter') {
      e.preventDefault();
      handleConfirm();
    }
  });

  render();
})();
</script>
</body>
</html>
